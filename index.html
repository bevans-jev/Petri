/* Diagnostic error box: if anything throws at runtime, show it on screen so it can be
   reported instead of failing silently. Safe to remove later. */
(function(){
  function box(){var d=document.getElementById("__errbox");
    if(!d){d=document.createElement("div");d.id="__errbox";
      d.style.cssText="position:fixed;left:0;right:0;bottom:0;max-height:45%;overflow:auto;z-index:2147483647;background:#2a0d0d;color:#ffc2c2;font:11px/1.45 ui-monospace,monospace;padding:10px 12px 12px;border-top:2px solid #d05a5a;white-space:pre-wrap";
      var t=document.createElement("div");t.textContent="⚠ runtime error (screenshot this and send it):";t.style.cssText="font-weight:700;margin-bottom:6px;color:#ff9a9a";
      var b=document.createElement("button");b.textContent="×";b.style.cssText="position:absolute;top:6px;right:10px;background:none;border:none;color:#ffc2c2;font-size:20px;cursor:pointer;line-height:1";b.onclick=function(){d.style.display="none";};
      d.appendChild(t);d.appendChild(b);document.body.appendChild(d);}
    d.style.display="block";return d;}
  function show(msg){try{var d=box();var p=document.createElement("div");p.style.marginTop="4px";p.textContent=msg;d.appendChild(p);}catch(_){}}
  window.addEventListener("error",function(e){show((e.message||"error")+(e.error&&e.error.stack?"\n"+e.error.stack:""));});
  window.addEventListener("unhandledrejection",function(e){show("promise: "+((e.reason&&(e.reason.stack||e.reason.message))||e.reason));});
})();

// CUBE mode stores six N×N faces in a hidden 3N×4N atlas:
//
//          U
//       L  F  R  B
//          D
//
// The atlas keeps the existing board/AI/state machinery intact, while the
// topology below supplies the REAL cube-surface neighbours. Two surface cells
// are orthogonal neighbours when they share a full 3D edge; they are diagonal
// neighbours when they share exactly one 3D corner. That makes the normal
// corner-only rule continue cleanly across every seam and around cube vertices.
const CUBE_FACE_POS=Object.freeze({U:[0,1],L:[1,0],F:[1,1],R:[1,2],B:[1,3],D:[2,1]});

const CUBE_FACE_NAME=Object.freeze({F:"FRONT",R:"RIGHT",B:"BACK",L:"LEFT",U:"TOP",D:"BOTTOM"});
const cubeGlobal=(face,r,c,N)=>{const p=CUBE_FACE_POS[face];return[p[0]*N+r,p[1]*N+c];};
// Which face is currently pointed most at the viewer, given the stage rotation
// {x:pitch, y:yaw} in degrees. Each face's outward normal is rotated by the same
// rotateX(x)·rotateY(y) the stage uses; the returned map is each face's +Z toward
// the camera (>0 = facing you, larger = more head-on). cubeFrontFace picks the
// most head-on face; the renderer also uses the map to make only clearly-visible
// faces interactive, so an edge-on sliver can't steal a click meant for the front.
const cubeFaceFacing=(rot)=>{const a=rot.x*Math.PI/180,b=rot.y*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a),cb=Math.cos(b),sb=Math.sin(b);
  return {F:cb*ca,B:-cb*ca,R:-sb*ca,L:sb*ca,U:-sa,D:sa};};
const cubeFrontFace=(rot)=>{const z=cubeFaceFacing(rot);let best="F",bv=-Infinity;for(const f in z)if(z[f]>bv){bv=z[f];best=f;}return best;};
const cubePoint=(x,y,z)=>`${x}:${y}:${z}`;
function cubeCellCorners(face,r,c,N){let q;
  if(face==="F")q=[[c,r,N],[c+1,r,N],[c,r+1,N],[c+1,r+1,N]];
  else if(face==="R")q=[[N,r,N-c],[N,r,N-c-1],[N,r+1,N-c],[N,r+1,N-c-1]];
  else if(face==="B")q=[[N-c,r,0],[N-c-1,r,0],[N-c,r+1,0],[N-c-1,r+1,0]];
  else if(face==="L")q=[[0,r,c],[0,r,c+1],[0,r+1,c],[0,r+1,c+1]];
  else if(face==="U")q=[[c,0,r],[c+1,0,r],[c,0,r+1],[c+1,0,r+1]];
  else q=[[c,N,N-r],[c+1,N,N-r],[c,N,N-r-1],[c+1,N,N-r-1]];
  return q.map(p=>cubePoint(p[0],p[1],p[2]));}

function cubeTopology(N){if(CUBE_TOPO_CACHE.has(N))return CUBE_TOPO_CACHE.get(N);
  const faceAt=new Map(),byCorner=new Map(),byEdge=new Map(),cells=[];
  const add=(m,k,v)=>{if(!m.has(k))m.set(k,[]);m.get(k).push(v);};
  for(const face of CUBE_FACE_IDS)for(let r=0;r<N;r++)for(let c=0;c<N;c++){

    const cell={face,r,c,gr,gc,k,corners};cells.push(cell);faceAt.set(k,cell);
    for(const p of corners)add(byCorner,p,k);
    for(const [a,b] of [[0,1],[0,2],[1,3],[2,3]])add(byEdge,[corners[a],corners[b]].sort().join("|"),k);}

  for(const c of cells){orth.set(c.k,new Set());diag.set(c.k,new Set());}

function cubeBoard(N,copies,withWalls){const topo=cubeTopology(N),voids=new Set(),walls=new Set();
  for(let r=0;r<topo.rows;r++)for(let c=0;c<topo.cols;c++)if(!topo.faceAt.has(r+","+c))voids.add(r+","+c);
  // Four alternating cube vertices: every player begins equally far from the
  // others, and two-player games start on opposite sides of the surface.
  const starts=[cubeGlobal("F",0,0,N),cubeGlobal("B",0,0,N),cubeGlobal("F",N-1,N-1,N),cubeGlobal("B",N-1,N-1,N)];
  if(withWalls){
    // Repeat one balanced obstacle motif on every face. The bars and corner
    // blocks are real blocked cells, exactly like walls on the flat maps.
    // They stop placements and still participate in seam-aware cube topology.
    const seeds=[[2,3],[2,4],[3,3],[N-3,N-4],[N-3,N-5],[N-4,N-4],[4,1],[5,1]];
    for(const face of CUBE_FACE_IDS)for(const [r,c] of seeds){
      if(r<0||c<0||r>=N||c>=N)continue;
      const [gr,gc]=cubeGlobal(face,r,c,N),k=gr+","+gc;
      if(!starts.some(([sr,sc])=>sr===gr&&sc===gc))walls.add(k);}

  return{rows:topo.rows,cols:topo.cols,walls,voids,specials:new Map(),starts,copies:copies||1,cube:true,cubeSize:N};}
const FP=(r,c,N)=>[[r,c],[c,N-1-r],[N-1-r,N-1-c],[N-1-c,r]];
const addSym=(s,r,c,N)=>FP(r,c,N).forEach(([a,b])=>s.add(a+","+b));
const addSymMap=(m,r,c,v,N)=>FP(r,c,N).forEach(([a,b])=>m.set(a+","+b,v));

// Build two square dishes of size `d` side by side into one (d rows) × (2d+1 cols)
// board. The middle column is an impassable void seam, so the dishes never link
// by adjacency, only via Vent tiles (mirrored across the seam). All four starts
// sit on the LEFT (home) dish, making the right dish a frontier you must reach.
function twinBoard(d,copies,withWalls){const H=d,W=2*d+1,seam=d,off=seam+1;
  const walls=new Set(),voids=new Set(),specials=new Map();
  for(let r=0;r<H;r++)voids.add(r+","+seam); // impassable seam down the middle
  // Lay out the LEFT dish with the same 4-fold rotational symmetry every other
  // map uses (addSym over a d×d square), so all four start-corners are equal.
  // Then translate every feature across the seam onto the RIGHT dish, which also

  const run=a=>{a.sort((x,y)=>x-y);let best=1,cur=1;for(let i=1;i<a.length;i++){if(a[i]===a[i-1]+1){cur++;if(cur>best)best=cur;}else cur=1;}return best;};

// ===== 4. RULES ENGINE =====================================================
// THE core rule. A placement is legal iff: every cell is empty and in bounds;
// no cell touches own color edge to edge (unless Bridge armed); and either it
// covers the start (first piece) or touches own color at a corner.

    return true;}

// ===== 6. EVENTS ===========================================================
const EVENTS={
  meteor:{name:"Meteor Strike",icon:"☄",blurb:"Rocks slam the dish, craters vaporize squares (yours, theirs, even walls) and leave permanent rubble behind.",kind:"instant"},
  quake:{name:"Earthquake",icon:"〰",blurb:"Fissures tear across the board; anything on a fault line falls in. Permanent.",kind:"instant"},
  bloom:{name:"Bloom",icon:"❀",blurb:"A growth surge, every surviving colony sprouts a couple of free squares.",kind:"instant",good:true},

const EVENT_IDS=Object.keys(EVENTS);
const EVT_COLOR={meteor:"#d8472e",quake:"#c98a3a",bloom:"#3fa35e",infection:"#8aac4a"};
function evShuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ===== 7. POWERS & SPECIAL TILES (engine) ==================================
// Choose where a CPU spends a Seed (best new growth corner) or Block (choke
// the strongest rival corner). Returns {type,cell} or null to hold the charge.
function cpuPowerAction(board,seat,pw,count,mates){const [H,W]=dimsOf(board);mates=mates||new Set();

      let ownAdj=false,opn=0;for(const [a,b] of neighbours(board,r,c,"all"))if(board[a][b]===0)opn++;for(const [a,b] of neighbours(board,r,c,"orth"))if(board[a][b]===seat)ownAdj=true;

/* Shared board helpers (pure; used by both human powers and CPU power logic). */

    `radial-gradient(circle at 50% 50%, ${withA(color,0)} 0 28%, ${withA(color,.3)} 52%, ${withA(color,1)} 76%, ${withA(color,.45)} 88%, ${withA(color,0)} 100%)`,

  // Vines: a real SVG tile, because a climbing tendril is a curve and gradients
  // cannot draw one. The stems exit each edge exactly where they enter the next
  // tile, so the growth runs continuously across a whole placed piece rather
  // than restarting in every square. Leaves alternate along the stem, and the
  // tile is grid-pinned so neighbouring cells stay in phase.
  if(tex==="vines"){const stem=withA(shade(color,-0.42),.95),stem2=withA(shade(color,-0.3),.75),
      leaf=withA(shade(color,0.22),.9),leaf2=withA(shade(color,0.45),.75),
      bud=withA(shade(color,0.6),.9),vein=withA(shade(color,-0.5),.4);
    // Two independent vine tiles at sizes that don't divide into each other (127
    // and 79) are layered on top of one another. Each tile is individually
    // seamless, but the pair only realigns after ~10,000px, so there is no
    // visible repeat at any board size — the growth reads as genuinely irregular
    // rather than stamped. A single tile, however carefully drawn, always reads
    // as wallpaper; this is the fix for that.
    const lf=(x,y,rot,sc,fill)=>`<g transform="translate(${x} ${y}) rotate(${rot}) scale(${sc})">
        <path d="M0 0 C 4 -6 12 -6.5 16 0 C 12 6.5 4 6 0 0 Z" fill="${fill||leaf}"/>
        <path d="M0 0 L 14 0" stroke="${vein}" stroke-width="0.9"/></g>`;
    // layer A — long wandering runners, seamless at y=38 / y=104 and x=52
    const A=`<svg xmlns="http://www.w3.org/2000/svg" width="127" height="127" viewBox="0 0 127 127">
      <path d="M0 38 C 18 38 22 14 44 16 C 66 18 62 46 84 44 C 104 42 110 38 127 38"
        stroke="${stem}" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M0 104 C 22 104 26 84 46 88 C 70 93 78 116 98 110 C 112 106 116 104 127 104"
        stroke="${stem}" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      <path d="M52 0 C 52 16 34 24 36 44 C 38 66 60 70 58 92 C 56 110 52 114 52 127"
        stroke="${stem2}" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M84 44 C 92 32 104 30 112 18" stroke="${stem2}" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <path d="M46 88 C 34 84 26 92 16 90" stroke="${stem2}" stroke-width="1.3" fill="none" stroke-linecap="round"/>
      ${lf(44,16,-48,1.05)}${lf(44,16,140,0.8,leaf2)}${lf(84,44,22,0.95)}${lf(36,44,-160,0.85)}
      ${lf(58,92,-38,1.0)}${lf(98,110,18,0.8,leaf2)}${lf(16,90,168,0.9)}${lf(112,18,-70,0.75)}
      ${lf(20,36,-15,0.7,leaf2)}${lf(70,100,-120,0.85)}${lf(108,40,55,0.65)}
      <circle cx="44" cy="16" r="1.9" fill="${bud}"/><circle cx="84" cy="44" r="1.6" fill="${bud}"/>
      <circle cx="58" cy="92" r="1.7" fill="${bud}"/><circle cx="16" cy="90" r="1.3" fill="${bud}"/>
    </svg>`;
    // layer B — a sparser, finer overlay on a different rhythm entirely
    const B=`<svg xmlns="http://www.w3.org/2000/svg" width="79" height="79" viewBox="0 0 79 79">
      <path d="M0 22 C 14 22 20 40 34 42 C 52 44 58 24 79 22"
        stroke="${withA(shade(color,-0.35),.62)}" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <path d="M24 79 C 24 62 12 56 14 40 C 16 22 24 16 24 0"
        stroke="${withA(shade(color,-0.35),.5)}" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      ${lf(34,42,-32,0.62,withA(shade(color,0.35),.62))}
      ${lf(14,40,150,0.55,withA(shade(color,0.3),.55))}
      ${lf(60,28,40,0.5,withA(shade(color,0.4),.5))}
      <circle cx="34" cy="42" r="1.2" fill="${withA(shade(color,0.6),.6)}"/>
    </svg>`;
    return {background:shade(color,-0.7),
      backgroundImage:`${svgBg(B)},${svgBg(A)}`,
      backgroundSize:"44px 44px, 70px 70px",
      backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(color,.3)}`};}
  // Kintsugi: the Japanese repair of broken pottery with lacquer and powdered
  // gold, which treats the break as part of the object's history rather than
  // something to hide. Fitting for a game about fragments becoming a whole —
  // every square is a shard, and the seams are gilded rather than concealed.
  if(tex==="kintsugi"){const glaze=shade(color,-0.12),deep=shade(color,-0.44);
    const G="rgba(214,178,94,",GH="rgba(247,226,168,";
    // Two cracks run clean through the tile — the horizontal enters and leaves at
    // y=14, the vertical at x=18 — so the break lines join up across every square
    // and read as one shattered surface. The short spurs dead-end on purpose:
    // real cracks branch and stop, and they never touch an edge, so nothing jogs.
    const web=`M0 14 L 11 18 L 22 9 L 33 16 L 44 14`,
          web2=`M18 0 L 22 9 L 15 21 L 21 32 L 18 44`,
          spur1=`M22 9 L 31 3`, spur2=`M15 21 L 5 26`, spur3=`M21 32 L 34 37`;
    const line=(d,w,col)=>`<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
      <rect width="44" height="44" fill="${glaze}"/>
      ${line(web,3.4,deep)}${line(web2,3.1,deep)}${line(spur1,2.4,deep)}${line(spur2,2.4,deep)}${line(spur3,2.4,deep)}
      ${line(web,1.7,G+"0.95)")}${line(web2,1.5,G+"0.92)")}
      ${line(spur1,1.1,G+"0.85)")}${line(spur2,1.1,G+"0.85)")}${line(spur3,1,G+"0.8)")}
      ${line(web,0.6,GH+"0.85)")}${line(web2,0.5,GH+"0.75)")}
      <circle cx="22" cy="9" r="1.6" fill="${GH}0.9)"/><circle cx="15" cy="21" r="1.4" fill="${GH}0.85)"/>
      <circle cx="21" cy="32" r="1.3" fill="${G}0.9)"/><circle cx="11" cy="18" r="1" fill="${G}0.85)"/>
      <circle cx="33" cy="16" r="1" fill="${G}0.85)"/>
    </svg>`;
    return {background:glaze,backgroundImage:svgBg(svg),backgroundSize:"30px 30px",
      backgroundAttachment:"fixed",boxShadow:`inset 0 0 0 1px rgba(214,178,94,.3)`};}
  // Aurora: every other skin decorates each square; this one refuses to. The
  // gradients are enormous (roughly 14 cells across) and pinned to the page
  // grid, so a placed piece falls inside a single sweep of colour and its cell
  // boundaries disappear completely. The base sits at full seat colour rather
  // than a dark wash — an earlier version started too dark and every nation
  // drifted toward the same muted tone, which defeats the point of a colour in
  // a territory game. The curtains now lighten and deepen that hue instead of
  // replacing it, so seats stay instantly told apart.
  if(tex==="aurora"){const hi=withA(shade(color,0.72),.75),mid=withA(shade(color,0.3),.55),
      low=withA(shade(color,-0.5),.6),edge=withA(shade(color,-0.7),.5);
    return {background:color,
      backgroundImage:
        `radial-gradient(130% 80% at 20% 15%, ${hi} 0%, ${withA(color,0)} 55%),`+
        `radial-gradient(95% 130% at 82% 85%, ${low} 0%, ${withA(color,0)} 52%),`+
        `conic-gradient(from 205deg at 50% 50%, ${mid} 0deg, ${withA(color,0)} 88deg, ${hi} 185deg, ${withA(color,0)} 272deg, ${mid} 360deg),`+
        `linear-gradient(155deg, ${withA(shade(color,0.85),.3)} 0%, ${withA(color,0)} 42%, ${edge} 100%)`,
      backgroundSize:"340px 340px, 260px 260px, 420px 420px, 180px 180px",
      backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 12px ${withA(shade(color,0.6),.22)}`};}
  // Tissue: irregular polygonal cells with bright walls, the way epithelium or a
  // dragonfly wing looks under magnification. The most on-theme pattern in the
  // set for a game played in a petri dish, and the only one built from genuinely
  // irregular geometry rather than a repeated motif — two layers again, at 113
  // and 71, so no cell shape ever lines up with itself.
  if(tex==="tissue"){const wall=withA(shade(color,0.55),.85),wall2=withA(shade(color,0.35),.5),
      body=shade(color,-0.35),nucleus=withA(shade(color,0.7),.5);
    const poly=(pts,f)=>`<polygon points="${pts}" fill="${f}" stroke="${wall}" stroke-width="1.6" stroke-linejoin="round"/>`;
    const A=`<svg xmlns="http://www.w3.org/2000/svg" width="113" height="113" viewBox="0 0 113 113">
      <rect width="113" height="113" fill="${body}"/>
      ${poly("0,0 26,6 34,30 12,44 0,34",withA(shade(color,-0.2),.9))}
      ${poly("26,6 58,0 70,22 52,38 34,30",withA(shade(color,-0.32),.9))}
      ${poly("58,0 90,4 100,26 78,34 70,22",withA(shade(color,-0.15),.9))}
      ${poly("90,4 113,0 113,30 100,26",withA(shade(color,-0.3),.9))}
      ${poly("0,34 12,44 6,72 0,78",withA(shade(color,-0.28),.9))}
      ${poly("12,44 34,30 52,38 48,66 20,74",withA(shade(color,-0.4),.9))}
      ${poly("52,38 70,22 78,34 84,60 62,70",withA(shade(color,-0.22),.9))}
      ${poly("78,34 100,26 113,30 113,58 84,60",withA(shade(color,-0.36),.9))}
      ${poly("6,72 20,74 26,98 8,104 0,78",withA(shade(color,-0.18),.9))}
      ${poly("20,74 48,66 62,70 58,96 26,98",withA(shade(color,-0.34),.9))}
      ${poly("62,70 84,60 113,58 113,92 88,96",withA(shade(color,-0.26),.9))}
      ${poly("26,98 58,96 88,96 90,113 30,113",withA(shade(color,-0.42),.9))}
      ${poly("8,104 26,98 30,113 0,113",withA(shade(color,-0.24),.9))}
      ${poly("88,96 113,92 113,113 90,113",withA(shade(color,-0.3),.9))}
      <circle cx="34" cy="46" r="2.4" fill="${nucleus}"/><circle cx="72" cy="48" r="2.1" fill="${nucleus}"/>
      <circle cx="42" cy="86" r="2.2" fill="${nucleus}"/><circle cx="92" cy="74" r="1.9" fill="${nucleus}"/>
      <circle cx="20" cy="20" r="1.8" fill="${nucleus}"/><circle cx="82" cy="16" r="2" fill="${nucleus}"/>
    </svg>`;
    const B=`<svg xmlns="http://www.w3.org/2000/svg" width="71" height="71" viewBox="0 0 71 71">
      <path d="M0 26 L 18 32 L 38 18 L 56 26 L 71 20" fill="none" stroke="${wall2}" stroke-width="1"/>
      <path d="M0 58 L 22 62 L 44 52 L 71 60" fill="none" stroke="${wall2}" stroke-width="0.9"/>
      <path d="M18 32 L 22 62" fill="none" stroke="${wall2}" stroke-width="0.9"/>
      <path d="M56 26 L 44 52" fill="none" stroke="${wall2}" stroke-width="0.9"/>
      <path d="M38 0 L 38 18" fill="none" stroke="${wall2}" stroke-width="0.8"/>
      <path d="M30 71 L 44 52" fill="none" stroke="${wall2}" stroke-width="0.8"/>
    </svg>`;
    return {background:body,backgroundImage:`${svgBg(B)},${svgBg(A)}`,
      backgroundSize:"38px 38px, 60px 60px",backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.4),.3)}`};}
  // Halftone: the colour is built out of dots rather than being a surface, the
  // way a risograph or newsprint image makes a solid tone from ink that never
  // was solid. The pitch matters more than anything here — an earlier version
  // used 7-13px dots against a ~28px cell, which is only two or three dots per
  // square and reads as chunky spots, not as tone. These are 4 and 5px, so a
  // cell carries ~40 dots and the eye blends them into shade. Two screens on
  // coprime pitches drift in and out of phase for a soft print mottle, and the
  // base stays at seat colour so the ink darkens it rather than replacing it.
  if(tex==="halftone"){const ink=withA(shade(color,-0.62),.85),lift=withA(shade(color,0.75),.5);
    return {background:color,
      backgroundImage:
        `radial-gradient(circle at 50% 50%, ${ink} 0 1.35px, ${withA(color,0)} 1.5px),`+
        `radial-gradient(circle at 50% 50%, ${lift} 0 0.9px, ${withA(color,0)} 1.05px)`,
      backgroundSize:"4px 4px, 5px 5px",
      backgroundPosition:"0 0, 2px 1px",
      backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(shade(color,-0.4),.35)}`};}

  /* ---- LEGENDARY TIER -----------------------------------------------------
     Four showpiece finishes. The problem with camo-style skins in a territory
     game is that real gold is just gold — four seats wearing it would be
     indistinguishable, which breaks the board. So each of these keeps the
     nation's colour doing real work underneath the treatment: gold runs a band
     of seat colour through the metal, wootz tints the steel, diamond colours
     the deep facets, and infected uses the seat hue as the glow.            */

  // Gold: polished metal is a reflection, so this is banded rather than shaded —
  // hard bright-to-dark steps read as a mirror finish where a smooth gradient
  // reads as plastic. The metal is deliberately kept to narrow veins: bright
  // yellow pulls the eye far harder than its share of the area, so even at a
  // minority of the surface it will swamp a nation's colour if given room. The
  // seat holds wide, fully saturated bands and the gold threads between them.
  if(tex==="gold"){
    // A self-contained metallic sheen per cell — a diagonal bright-to-dark
    // gradient over the seat colour with two crisp specular streaks, so it reads
    // as polished metal in the nation's colour without depending on grid tiling
    // (the old grid-pinned version produced the broken misaligned streaks).
    const hi=withA(shade(color,0.85),.9),lo=shade(color,-0.4),edge=shade(color,-0.62);
    return {background:color,
      backgroundImage:
        `linear-gradient(120deg, ${edge} 0%, ${shade(color,-0.15)} 20%, ${shade(color,0.3)} 40%,`+
        ` ${hi} 48%, ${shade(color,0.3)} 56%, ${lo} 74%, ${shade(color,0.2)} 90%, ${edge} 100%),`+
        `linear-gradient(120deg, rgba(255,255,255,0) 44%, rgba(255,255,255,.5) 48%, rgba(255,255,255,0) 52%),`+
        `linear-gradient(120deg, rgba(255,255,255,0) 84%, rgba(255,255,255,.28) 87%, rgba(255,255,255,0) 90%)`,
      backgroundSize:"100% 100%, 100% 100%, 100% 100%",
      boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.6),.4)}, inset 0 0 7px ${withA(shade(color,-0.5),.35)}`};}

  // Wootz: crucible steel from southern India, forged for well over a millennium
  // and traded across the medieval world, where the carbide banding surfaces as
  // flowing watered light when the blade is etched. Named for the material
  // itself rather than the city that sold it. Drawn as nested strokes because
  // the real thing is layers of laminate, not shading, and the bands carry a
  // faint shift in hue the way etched steel throws colour. Two layers at 149/89
  // so the pattern never visibly repeats.
  if(tex==="wootz"){
    // Watered-steel: tight horizontal contour bands like a Damascus blade. The
    // old version used a 149px tile so each cell showed only a sliver of one
    // wave and read as random streaks; this is a 24px tile — several clean bands
    // per cell — grid-pinned so the watering flows across a placement.
    const lt=withA(shade(color,0.85),.9),dk=withA(shade(color,-0.68),.92),
      md=withA(shade(color,0.35),.6);
    const band=(y,w,col)=>`<path d="M0 ${y} C 6 ${y-2.5} 12 ${y+2.5} 18 ${y} C 22 ${y-1.6} 24 ${y+1} 24 ${y}"
      fill="none" stroke="${col}" stroke-width="${w}"/>`;
    let g="";for(let i=0;i<9;i++){const y=1.5+i*2.8;g+=band(y,i%3===0?1.4:0.9,i%3===0?lt:i%3===1?dk:md);}
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
      <rect width="24" height="24" fill="${shade(color,-0.28)}"/>${g}</svg>`;
    return {background:shade(color,-0.28),backgroundImage:svgBg(svg),
      backgroundSize:"24px 24px",backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.5),.4)}`};}

  // Diamond: the previous cut crammed twelve facets into a tile smaller than a
  // cell, which at playing size was just visual noise. A real brilliant reads as
  // ONE stone with a clear table and a few big crown facets, so that is what
  // this is now: a single gem filling the square, four bold facets around a
  // bright table, hard edges, and two glints. The facets are cut from the seat
  // colour so nations stay apart; white is only the table highlight and the
  // sparkle.
  if(tex==="diamond"){const f=(a)=>shade(color,a);
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
      <polygon points="16,1 31,12 16,31 1,12" fill="${f(-0.3)}"/>
      <polygon points="16,1 31,12 16,12" fill="${f(0.45)}"/>
      <polygon points="16,1 1,12 16,12" fill="${f(0.72)}"/>
      <polygon points="1,12 16,12 16,31" fill="${f(-0.12)}"/>
      <polygon points="31,12 16,12 16,31" fill="${f(-0.55)}"/>
      <polygon points="16,5 24,12 16,12 8,12" fill="rgba(255,255,255,.4)"/>
      <g stroke="rgba(255,255,255,.55)" stroke-width="0.9" fill="none">
        <polygon points="16,1 31,12 16,31 1,12"/><path d="M1 12 L31 12"/><path d="M16 1 L16 31"/></g>
      <path d="M10 8 L11.4 10.4 L13.8 11.8 L11.4 13.2 L10 15.6 L8.6 13.2 L6.2 11.8 L8.6 10.4 Z" fill="rgba(255,255,255,.92)"/>
      <path d="M21 15 L21.9 16.6 L23.5 17.5 L21.9 18.4 L21 20 L20.1 18.4 L18.5 17.5 L20.1 16.6 Z" fill="rgba(255,255,255,.7)"/>
    </svg>`;
    return {background:cellBg,backgroundImage:svgBg(svg),
      backgroundSize:"100% 100%",backgroundRepeat:"no-repeat"};}

  // Infected: the previous version drew fine glowing filaments, which at 28px
  // simply vanished — it read as a plain dark square, which is why it looked
  // dead. Replaced with something crude and legible: heavy dark necrotic
  // blotches eating into the surface, ringed with a hot rim, plus a few bright
  // pustules. Blobs survive being shrunk; hairlines do not.
  if(tex==="infected"){const skin=shade(color,-0.15),rot=shade(color,-0.82),
      rim=withA(shade(color,0.9),.95),pus=withA(shade(color,1),1),
      soft=withA(shade(color,-0.7),.55);
    const blot=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r+2.5}" fill="${soft}"/>
      <circle cx="${x}" cy="${y}" r="${r}" fill="${rot}" stroke="${rim}" stroke-width="1.6"/>`;
    const pust=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r*2.2}" fill="${withA(shade(color,0.8),.3)}"/>
      <circle cx="${x}" cy="${y}" r="${r}" fill="${pus}"/>`;
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="84" height="84" viewBox="0 0 84 84">
      <rect width="84" height="84" fill="${skin}"/>
      ${blot(20,18,11)}${blot(62,30,9)}${blot(34,58,12)}${blot(72,68,8)}
      ${blot(4,48,7)}${blot(80,6,7)}${blot(48,80,8)}${blot(6,80,6)}
      ${pust(20,18,3.2)}${pust(62,30,2.6)}${pust(34,58,3.4)}${pust(72,68,2.4)}
      ${pust(4,48,2)}${pust(48,80,2.2)}
      <g stroke="${rim}" stroke-width="1.3" fill="none" opacity="0.7">
        <path d="M20 18 C 34 22 48 26 62 30"/><path d="M34 58 C 26 44 24 30 20 18"/>
        <path d="M62 30 C 68 46 70 56 72 68"/><path d="M34 58 C 42 68 44 74 48 80"/></g>
    </svg>`;
    return {background:skin,backgroundImage:svgBg(svg),
      backgroundSize:"44px 44px",backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.5),.4)}`};}

  // Web: the only finish that is mostly not there. The first version used a
  // 96px orb against a 28px cell, so each square showed roughly a third of a web
  // and just read as faint scratches. The tile is now 32px — about one whole web
  // per cell — with far fewer, thicker strands, so the shape is actually
  // recognisable. Radials still exit at corners and edge midpoints, so
  // neighbouring webs join rather than each square holding an isolated one.
  if(tex==="web"){const silk=withA(shade(color,0.9),.95),silk2=withA(shade(color,0.7),.6),
      node=withA(shade(color,1),1),haze=withA(color,.2);
    const C=16,R=16;
    const A=[[0,0],[16,0],[32,0],[32,16],[32,32],[16,32],[0,32],[0,16]];
    let radial="",spiral="";
    A.forEach(([x,y])=>{radial+=`<path d="M${C} ${C} L${x} ${y}" stroke="${silk}" stroke-width="1.15" fill="none"/>`;});
    [7,12,16].forEach((r,ri)=>{
      for(let i=0;i<A.length;i++){
        const [x1,y1]=A[i],[x2,y2]=A[(i+1)%A.length];
        const p1x=C+(x1-C)*r/R,p1y=C+(y1-C)*r/R;
        const p2x=C+(x2-C)*r/R,p2y=C+(y2-C)*r/R;
        const mx=(p1x+p2x)/2,my=(p1y+p2y)/2;
        const cx=C+(mx-C)*0.74,cy=C+(my-C)*0.74;   // strands sag toward the hub
        spiral+=`<path d="M${p1x.toFixed(1)} ${p1y.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${p2x.toFixed(1)} ${p2y.toFixed(1)}"
          stroke="${ri===1?silk2:silk}" stroke-width="${ri===2?0.8:1}" fill="none"/>`;}});
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
      ${spiral}${radial}<circle cx="${C}" cy="${C}" r="1.5" fill="${node}"/></svg>`;
    return {background:cellBg,
      backgroundImage:`${svgBg(svg)},linear-gradient(0deg, ${haze}, ${haze})`,
      backgroundSize:"32px 32px, 100% 100%",
      backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(color,.55)}`};}

  // Chevron: a hard zigzag, built from four corner wedges so the V stays crisp
  // rather than antialiasing into mush at small sizes.
  if(tex==="chevron"){const a=shade(color,0.5),b=shade(color,-0.42);
    return {background:b,
      backgroundImage:
        `linear-gradient(135deg, ${a} 25%, transparent 25%),`+
        `linear-gradient(225deg, ${a} 25%, transparent 25%),`+
        `linear-gradient(315deg, ${a} 25%, transparent 25%),`+
        `linear-gradient(45deg, ${a} 25%, transparent 25%)`,
      backgroundSize:"14px 14px, 14px 14px, 14px 14px, 14px 14px",
      backgroundPosition:"-7px 0, -7px 0, 0 0, 0 0",
      backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.4),.3)}`};}

  // Scales: overlapping arcs in offset rows, like a carp or a roof. The two
  // layers sit half a tile apart, which is what makes the rows interlock.
  if(tex==="scales"){const lip=withA(shade(color,0.75),.9),body=shade(color,-0.3);
    const arc=c=>`radial-gradient(circle at 50% 0%, ${c} 0 46%, ${withA(color,0)} 47%)`;
    return {background:body,
      backgroundImage:`${arc(withA(shade(color,0.25),.95))},${arc(lip)}`,
      backgroundSize:"18px 18px, 18px 18px",
      backgroundPosition:"0 0, 9px 9px",
      backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.35),.35)}`};}

  /* ---- MARKS --------------------------------------------------------------
     Everything above fills the square and relies on pattern to distinguish it,
     which is why so much of the set blurs together at a 28px cell. These don't
     fill anything. The cell stays bare board and a single shape sits on it, the
     way Colony's dot does, so a placed piece reads as a row of marks rather than
     a coloured block. Shape carries the identity here, not texture.         */
  const mark=(inner,pad)=>({background:cellBg,
    backgroundImage:svgBg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">${inner}</svg>`),
    backgroundSize:(pad||"86%")+" "+(pad||"86%"),
    backgroundPosition:"center",backgroundRepeat:"no-repeat"});

  // X: just an X. No square, no border, no fill.
  if(tex==="cross")return mark(
    `<g stroke="${color}" stroke-width="4.2" stroke-linecap="round">
       <path d="M5 5 L19 19"/><path d="M19 5 L5 19"/></g>`);
  // Triune: three linked corners around a forbidden central point.
  if(tex==="triangle")return mark(
    `<g fill="none" stroke="${color}" stroke-width="2.4" stroke-linejoin="round">
       <path d="M12 2.5 L21 19.5 L3 19.5 Z"/><path d="M12 7 L16.8 16 L7.2 16 Z"/></g>
     <circle cx="12" cy="12.8" r="1.8" fill="${color}"/>`);
  // Hive Rune: a broken hexagonal seal with a suspended diamond.
  if(tex==="hex")return mark(
    `<g fill="none" stroke="${color}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
       <path d="M9 3 L4 6 L4 11 M15 3 L20 6 L20 11 M20 15 L20 18 L15 21 M9 21 L4 18 L4 15"/>
       <path d="M12 7 L17 12 L12 17 L7 12 Z"/></g>`);
  // Signal: an asymmetric transmission glyph, not another ordinary star.
  if(tex==="star")return mark(
    `<g fill="none" stroke="${color}" stroke-linecap="round">
       <circle cx="8" cy="12" r="2.2" fill="${color}" stroke="none"/>
       <path d="M12 7 Q18 12 12 17" stroke-width="2.5"/>
       <path d="M15 4 Q24 12 15 20" stroke-width="2"/></g>`);
  // Eclipse: a dark occlusion cut through a luminous crescent.
  if(tex==="ring")return mark(
    `<circle cx="12" cy="12" r="9" fill="${color}"/>
     <circle cx="16" cy="9" r="8.2" fill="${cellBg}"/>
     <circle cx="6.2" cy="17.2" r="1.3" fill="${color}" opacity=".65"/>`);
  // Claw: three tapered cuts, replacing the duplicate single diagonal.
  if(tex==="blade")return mark(
    `<g fill="none" stroke="${color}" stroke-linecap="round">
       <path d="M4 18 Q9 13 11 4" stroke-width="3.2"/>
       <path d="M9 21 Q14 15 16 6" stroke-width="2.8"/>
       <path d="M15 21 Q19 16 20 10" stroke-width="2.3"/></g>`);

  /* ---- FIVE NEW SKINS -----------------------------------------------------
     New structural families not covered by the existing set: circuitry, plasma,
     marble, camo, and a lightning mark. Each keeps the seat colour doing the
     heavy lifting so nations stay tellable apart on the board.             */

  // Circuit: printed-board traces with solder pads. Right-angle paths and vias,
  // the way a PCB looks. Grid-pinned so the traces run across a placement.
  if(tex==="circuit"){const trace=withA(shade(color,0.7),.9),trace2=withA(shade(color,0.45),.6),
      pad=withA(shade(color,0.95),1),base=shade(color,-0.5);
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
      <rect width="40" height="40" fill="${base}"/>
      <g fill="none" stroke="${trace}" stroke-width="1.5" stroke-linecap="round">
        <path d="M0 8 L 12 8 L 12 20 L 28 20"/><path d="M20 0 L 20 12 L 32 12 L 32 28"/>
        <path d="M8 40 L 8 26 L 22 26 L 22 34 L 40 34"/><path d="M40 6 L 30 6 L 30 16"/></g>
      <g fill="none" stroke="${trace2}" stroke-width="1">
        <path d="M0 30 L 14 30 L 14 40"/><path d="M36 40 L 36 22 L 24 22"/></g>
      <g fill="${pad}">
        <circle cx="12" cy="8" r="2"/><circle cx="28" cy="20" r="2"/><circle cx="20" cy="12" r="1.8"/>
        <circle cx="32" cy="28" r="2"/><circle cx="8" cy="26" r="1.8"/><circle cx="30" cy="16" r="1.6"/>
        <circle cx="22" cy="34" r="1.6"/></g>
      <g fill="${base}"><circle cx="12" cy="8" r="0.8"/><circle cx="28" cy="20" r="0.8"/><circle cx="32" cy="28" r="0.8"/></g>
    </svg>`;
    return {background:base,backgroundImage:svgBg(svg),backgroundSize:"40px 40px",
      backgroundAttachment:"fixed",boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.4),.35)}`};}

  // Plasma: a glowing energy core — a hot bright centre bleeding out through the
  // seat colour into a dark rim, with a couple of orbiting arcs. Reads instantly
  // at cell size where a flame's fine tongues would blur, and it's unmistakably
  // "energy" without leaving the nation's colour. (Replaced an earlier flame
  // that couldn't read its hot tips at 28px.)
  if(tex==="plasma"){const core=withA(shade(color,1),1),mid=withA(shade(color,0.4),.9),
      rim=shade(color,-0.72),arc=withA(shade(color,0.7),.7);
    return {background:rim,
      backgroundImage:
        `radial-gradient(circle at 50% 50%, ${core} 0 8%, ${mid} 22%, ${withA(color,.6)} 40%, ${withA(color,0)} 62%),`+
        `radial-gradient(circle at 30% 34%, ${arc} 0 3%, ${withA(color,0)} 9%),`+
        `radial-gradient(circle at 72% 66%, ${arc} 0 3%, ${withA(color,0)} 9%)`,
      backgroundSize:"100% 100%, 100% 100%, 100% 100%",
      boxShadow:`inset 0 0 8px ${withA(shade(color,0.5),.4)}, inset 0 0 0 1px ${withA(shade(color,-0.4),.5)}`};}

  // Marble: veined stone. A pale seat-tinted body shot through with darker
  // wandering veins and a few bright ones, like polished marble. Two layers at
  // coprime sizes so the veining never visibly repeats.
  if(tex==="marble"){const body=shade(color,0.15),
      vein=withA(shade(color,-0.55),.7),vein2=withA(shade(color,-0.35),.45),
      bright=withA(shade(color,0.8),.5);
    const A=`<svg xmlns="http://www.w3.org/2000/svg" width="97" height="97" viewBox="0 0 97 97">
      <rect width="97" height="97" fill="${body}"/>
      <g fill="none" stroke-linecap="round">
        <path d="M0 20 C 20 30 30 10 50 22 C 70 34 80 14 97 24" stroke="${vein}" stroke-width="1.8"/>
        <path d="M0 58 C 24 50 34 72 54 62 C 74 52 84 70 97 60" stroke="${vein}" stroke-width="1.5"/>
        <path d="M20 0 C 30 24 10 40 24 60 C 38 80 22 88 30 97" stroke="${vein2}" stroke-width="1.2"/>
        <path d="M70 0 C 62 26 84 40 74 62 C 66 82 82 90 76 97" stroke="${vein2}" stroke-width="1.1"/>
        <path d="M0 20 C 20 30 30 10 50 22 C 70 34 80 14 97 24" stroke="${bright}" stroke-width="0.5"/>
        <path d="M0 40 C 30 44 40 30 64 40 C 82 47 90 38 97 42" stroke="${vein2}" stroke-width="0.9"/></g>
    </svg>`;
    const B=`<svg xmlns="http://www.w3.org/2000/svg" width="61" height="61" viewBox="0 0 61 61">
      <g fill="none" stroke="${vein2}" stroke-width="0.8" stroke-linecap="round">
        <path d="M0 34 C 16 28 24 42 40 36 C 52 31 56 40 61 36"/>
        <path d="M34 0 C 30 18 44 26 38 44 C 34 56 44 58 40 61"/></g>
    </svg>`;
    return {background:body,backgroundImage:`${svgBg(B)},${svgBg(A)}`,
      backgroundSize:"61px 61px, 97px 97px",backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.3),.3)}`};}

  // Camo: four-tone blotch camouflage in shades of the seat colour. Irregular
  // organic patches, two layers at coprime sizes so the pattern doesn't tile
  // visibly. Reads unmistakably as camo while staying on-colour.
  if(tex==="camo"){const c1=shade(color,-0.15),c2=shade(color,0.2),c3=shade(color,-0.45),c4=shade(color,0.5);
    const blob=(pts,f)=>`<path d="${pts}" fill="${f}"/>`;
    const A=`<svg xmlns="http://www.w3.org/2000/svg" width="76" height="76" viewBox="0 0 76 76">
      <rect width="76" height="76" fill="${c1}"/>
      ${blob("M6 8 Q 22 2 30 14 Q 38 26 24 32 Q 8 36 4 22 Q 2 12 6 8 Z",c2)}
      ${blob("M50 4 Q 68 6 70 20 Q 72 32 58 30 Q 46 28 46 16 Q 46 6 50 4 Z",c3)}
      ${blob("M14 44 Q 30 40 34 54 Q 36 68 20 68 Q 6 68 6 54 Q 6 46 14 44 Z",c4)}
      ${blob("M52 42 Q 70 40 74 54 Q 76 70 60 72 Q 46 72 46 58 Q 46 44 52 42 Z",c2)}
      ${blob("M36 24 Q 48 22 50 34 Q 50 44 40 44 Q 30 44 30 34 Q 30 26 36 24 Z",c3)}
    </svg>`;
    const B=`<svg xmlns="http://www.w3.org/2000/svg" width="53" height="53" viewBox="0 0 53 53">
      ${blob("M4 30 Q 16 26 20 36 Q 22 46 10 46 Q 0 46 0 36 Q 0 32 4 30 Z",withA(c4,.7))}
      ${blob("M34 6 Q 46 4 48 16 Q 48 24 38 24 Q 30 24 30 14 Q 30 8 34 6 Z",withA(c3,.7))}
    </svg>`;
    return {background:c1,backgroundImage:`${svgBg(B)},${svgBg(A)}`,
      backgroundSize:"53px 53px, 76px 76px",backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.3),.25)}`};}

  // Bolt: a lightning mark on the bare cell, like the other marks but jagged.
  // A single forked bolt in the seat colour, glowing, no filled square.
  if(tex==="bolt"){const glow=withA(shade(color,0.5),.5);
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
      <path d="M14 1 L5 13 L11 13 L9 23 L19 9 L12.5 9 Z" fill="${glow}" transform="scale(1.08)" transform-origin="12 12"/>
      <path d="M14 1 L5 13 L11 13 L9 23 L19 9 L12.5 9 Z" fill="${color}"/>
    </svg>`;
    return {background:cellBg,backgroundImage:svgBg(svg),
      backgroundSize:"84% 84%",backgroundPosition:"center",backgroundRepeat:"no-repeat"};}

  /* ---- ORGANIC TRIO (vines vibe) ------------------------------------------
     Illustrated, flowing, living — the same spirit as Vines. Each is a real SVG
     tile whose strands exit where a neighbour's enter, so the growth runs
     continuously across a placement, and each carries the seat colour in light,
     dark and transparent variants so nations stay recognisable.            */

  // Coral: a dense reef cluster — rounded coral heads packed together with a
  // bumpy brain-coral texture, plus tiny polyp mouths. Reads as a clustered reef,
  // deliberately NOT branchy, so it can't be confused with kelp. Grid-pinned so
  // the reef spreads across a placement.
  if(tex==="coral"){const head=withA(shade(color,0.3),.95),head2=withA(shade(color,0.55),.9),
      lip=withA(shade(color,0.85),.8),mouth=shade(color,-0.5),base=shade(color,-0.6);
    const knob=(cx,cy,r,fill)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${fill}" stroke="${lip}" stroke-width="0.8"/>`;
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="46" height="46" viewBox="0 0 46 46">
      <rect width="46" height="46" fill="${base}"/>
      ${knob(10,10,9,head)}${knob(30,8,8,head2)}${knob(42,18,7,head)}${knob(16,26,10,head2)}
      ${knob(34,28,9,head)}${knob(8,40,8,head2)}${knob(26,42,9,head)}${knob(44,40,7,head2)}
      <g fill="${mouth}"><circle cx="10" cy="10" r="1.4"/><circle cx="30" cy="8" r="1.2"/>
        <circle cx="16" cy="26" r="1.5"/><circle cx="34" cy="28" r="1.4"/><circle cx="26" cy="42" r="1.4"/>
        <circle cx="8" cy="40" r="1.2"/><circle cx="42" cy="18" r="1.1"/></g>
      <g fill="${lip}" opacity="0.5"><circle cx="7" cy="7" r="1.5"/><circle cx="27" cy="5" r="1.3"/>
        <circle cx="13" cy="23" r="1.6"/><circle cx="31" cy="25" r="1.5"/><circle cx="23" cy="39" r="1.4"/></g>
    </svg>`;
    return {background:base,backgroundImage:svgBg(svg),backgroundSize:"46px 46px",
      backgroundAttachment:"fixed",boxShadow:`inset 0 0 0 1px ${withA(color,.35)}`};}

  // Kelp: broad flat blades of seaweed rising in vertical ribbons — wide leafy
  // fronds, not thin stalks — so it reads as a kelp forest and stays clearly
  // distinct from coral's rounded cluster. Blades run top-to-bottom so they meet
  // across cells.
  if(tex==="kelp"){const blade=withA(shade(color,0.4),.9),blade2=withA(shade(color,0.6),.75),
      spine=withA(shade(color,0.15),.85),base=shade(color,-0.66);
    const leaf=(x,w,fill)=>`<path d="M${x} 48 C ${x-w} 40 ${x-w*0.6} 28 ${x} 20 C ${x+w*0.6} 12 ${x+w} 4 ${x} -4"
      fill="${fill}" stroke="${spine}" stroke-width="0.8"/>`;
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="44" height="48" viewBox="0 0 44 48">
      <rect width="44" height="48" fill="${base}"/>
      ${leaf(11,7,blade)}${leaf(24,8,blade2)}${leaf(36,6,blade)}
      <g fill="none" stroke="${spine}" stroke-width="1" opacity="0.6">
        <path d="M11 48 C 8 36 13 24 11 12 C 10 4 11 0 11 -4"/>
        <path d="M24 48 C 21 36 26 24 24 12 C 23 4 24 0 24 -4"/>
        <path d="M36 48 C 33 36 38 24 36 12"/></g>
    </svg>`;
    return {background:base,backgroundImage:svgBg(svg),backgroundSize:"44px 48px",
      backgroundAttachment:"fixed",boxShadow:`inset 0 0 0 1px ${withA(color,.32)}`};}

  // Lichen: crusty rosette lichen spreading in overlapping lobed patches, the way
  // it creeps across rock. Soft irregular blobs with a paler rim and speckled
  // fruiting bodies. Two layers at coprime sizes so it never tiles visibly.
  if(tex==="lichen"){const patch=withA(shade(color,0.25),.85),rim=withA(shade(color,0.7),.7),
      spot=withA(shade(color,0.9),.85),base=shade(color,-0.5);
    const lobe=(cx,cy,r)=>`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${patch}" stroke="${rim}" stroke-width="1.2"/>`;
    const A=`<svg xmlns="http://www.w3.org/2000/svg" width="67" height="67" viewBox="0 0 67 67">
      <rect width="67" height="67" fill="${base}"/>
      ${lobe(14,16,9)}${lobe(24,12,6)}${lobe(20,26,7)}${lobe(48,20,10)}${lobe(58,14,6)}
      ${lobe(40,44,8)}${lobe(52,50,9)}${lobe(16,50,8)}${lobe(30,56,6)}${lobe(62,42,6)}
      <g fill="${spot}"><circle cx="14" cy="16" r="1.6"/><circle cx="48" cy="20" r="1.8"/>
        <circle cx="40" cy="44" r="1.5"/><circle cx="52" cy="50" r="1.6"/><circle cx="16" cy="50" r="1.4"/>
        <circle cx="20" cy="26" r="1.3"/></g>
    </svg>`;
    const B=`<svg xmlns="http://www.w3.org/2000/svg" width="43" height="43" viewBox="0 0 43 43">
      ${lobe(10,30,5)}${lobe(34,10,5)}${lobe(28,34,4)}
      <g fill="${spot}"><circle cx="10" cy="30" r="1.2"/><circle cx="34" cy="10" r="1.2"/></g>
    </svg>`;
    return {background:base,backgroundImage:`${svgBg(B)},${svgBg(A)}`,
      backgroundSize:"43px 43px, 67px 67px",backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.4),.3)}`};}

  /* ---- LIVING TRIO (a meadow, a bough, and a haunt) -----------------------
     Three in the Vines spirit — real SVG tiles, two coprime layers so the
     growth never visibly repeats, seat colour in light/dark/transparent
     variants so nations stay tellable apart. Wildflower stamps small blooms;
     Blossom and Spirits use much larger tiles and flow CONTINUOUSLY, so
     neighbouring cells never look identical the way a tight tile can.        */

  // Wildflower: a scattered meadow of little five-petal blossoms with bright
  // centres, sitting on fine grassy strokes. Two tiles at coprime sizes (71/47)
  // so the bloom never tiles visibly; grid-pinned so the bed spreads across a
  // whole placement instead of restarting inside every square.
  if(tex==="flowers"){const petal=withA(shade(color,0.5),.92),petal2=withA(shade(color,0.7),.85),
      heart=withA(shade(color,0.95),.95),grass=withA(shade(color,0.1),.55),base=shade(color,-0.62);
    // one blossom: five petals swept round a centre, drawn once and rotated
    const flower=(cx,cy,r,fill,core)=>{let p="";for(let i=0;i<5;i++){const a=i*72*Math.PI/180;
        const px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;
        p+=`<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="${(r*0.62).toFixed(1)}" ry="${(r*0.4).toFixed(1)}" fill="${fill}" transform="rotate(${(i*72).toFixed(1)} ${px.toFixed(1)} ${py.toFixed(1)})"/>`;}
      return `${p}<circle cx="${cx}" cy="${cy}" r="${(r*0.5).toFixed(1)}" fill="${core}"/>`;};
    const A=`<svg xmlns="http://www.w3.org/2000/svg" width="71" height="71" viewBox="0 0 71 71">
      <rect width="71" height="71" fill="${base}"/>
      <g fill="none" stroke="${grass}" stroke-width="1" stroke-linecap="round">
        <path d="M12 71 C 10 58 14 50 12 40"/><path d="M40 71 C 42 60 38 52 40 44"/>
        <path d="M60 71 C 58 60 62 54 60 46"/><path d="M26 0 C 28 10 24 16 26 24"/></g>
      ${flower(14,16,7,petal,heart)}${flower(44,12,6,petal2,heart)}${flower(58,30,7,petal,heart)}
      ${flower(30,40,8,petal2,heart)}${flower(12,44,6,petal,heart)}${flower(52,54,7,petal2,heart)}
      ${flower(28,64,6,petal,heart)}${flower(66,60,5,petal2,heart)}
    </svg>`;
    const B=`<svg xmlns="http://www.w3.org/2000/svg" width="47" height="47" viewBox="0 0 47 47">
      ${flower(10,32,4,withA(shade(color,0.6),.7),withA(shade(color,0.95),.8))}
      ${flower(34,10,4,withA(shade(color,0.55),.7),withA(shade(color,0.9),.8))}
      ${flower(38,38,3,withA(shade(color,0.65),.6),withA(shade(color,0.95),.7))}
    </svg>`;
    return {background:base,backgroundImage:`${svgBg(B)},${svgBg(A)}`,
      backgroundSize:"47px 47px, 71px 71px",backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.4),.3)}`};}

  // Blossom: a flowering branch — cherry/plum sprigs of five rounded petals with
  // stamens and buds, carried on dark boughs that sweep across the board. Where
  // Wildflower stamps scattered daisies, this one is CONTINUOUS on big coprime
  // tiles (113/71), so the bough flows on from cell to cell and neighbouring
  // squares never look identical — a whole placement reads as one blossoming limb.
  if(tex==="blossom"){const branch=shade(color,-0.34),branch2=withA(shade(color,-0.2),.8),
      pet=withA(shade(color,0.62),.95),pet2=withA(shade(color,0.8),.9),
      stamen=withA(shade(color,0.2),.9),dot=withA(shade(color,-0.3),.7),bud=withA(shade(color,0.4),.9),base=shade(color,-0.66);
    // one blossom: five rounded petals swept round a stamen, plus tiny anthers
    const bloom=(cx,cy,r,fill)=>{let p="";for(let i=0;i<5;i++){const a=(i*72-90)*Math.PI/180;
        const px=(cx+Math.cos(a)*r*0.86).toFixed(1),py=(cy+Math.sin(a)*r*0.86).toFixed(1);
        p+=`<path d="M${px} ${py} m ${(-r*.5).toFixed(1)} 0 a ${(r*.5).toFixed(1)} ${(r*.6).toFixed(1)} 0 1 1 ${r.toFixed(1)} 0 a ${(r*.5).toFixed(1)} ${(r*.6).toFixed(1)} 0 1 1 ${(-r).toFixed(1)} 0 Z" fill="${fill}" transform="rotate(${i*72} ${cx} ${cy})"/>`;}
      p+=`<circle cx="${cx}" cy="${cy}" r="${(r*0.42).toFixed(1)}" fill="${stamen}"/>`;
      for(let i=0;i<5;i++){const a=i*72*Math.PI/180;p+=`<circle cx="${(cx+Math.cos(a)*r*.34).toFixed(1)}" cy="${(cy+Math.sin(a)*r*.34).toFixed(1)}" r="0.8" fill="${dot}"/>`;}
      return p;};
    const A=`<svg xmlns="http://www.w3.org/2000/svg" width="113" height="113" viewBox="0 0 113 113">
      <rect width="113" height="113" fill="${base}"/>
      <g fill="none" stroke="${branch}" stroke-width="3" stroke-linecap="round">
        <path d="M-4 96 C 24 88 34 70 58 66 C 82 62 96 44 120 34"/>
        <path d="M58 66 C 64 50 60 36 70 18 M58 66 C 46 58 34 60 22 50"/></g>
      <g fill="none" stroke="${branch2}" stroke-width="1.6" stroke-linecap="round">
        <path d="M70 18 C 76 12 84 12 92 6 M22 50 C 14 46 10 52 2 50 M96 44 C 104 40 108 46 116 44"/></g>
      ${bloom(20,84,8,pet)}${bloom(58,66,9,pet2)}${bloom(70,18,8,pet)}${bloom(96,44,7,pet2)}${bloom(38,58,6,pet)}${bloom(90,8,6,pet2)}
      <g fill="${bud}"><circle cx="30" cy="72" r="2.4"/><circle cx="66" cy="34" r="2.2"/><circle cx="108" cy="38" r="2"/><circle cx="14" cy="90" r="2"/></g>
    </svg>`;
    const B=`<svg xmlns="http://www.w3.org/2000/svg" width="71" height="71" viewBox="0 0 71 71">
      <g fill="none" stroke="${withA(shade(color,-0.15),.5)}" stroke-width="1.3" stroke-linecap="round">
        <path d="M4 30 C 22 26 30 12 48 10 M48 10 C 54 4 62 6 68 0"/></g>
      ${bloom(46,12,5.5,withA(shade(color,0.72),.75))}${bloom(10,52,5,withA(shade(color,0.66),.7))}
      <circle cx="60" cy="6" r="2" fill="${withA(shade(color,0.4),.7)}"/>
    </svg>`;
    return {background:base,backgroundImage:`${svgBg(B)},${svgBg(A)}`,
      backgroundSize:"71px 71px, 113px 113px",backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.4),.3)}`};}

  // Fern: feathery fronds unfurling across the board — each spine carries paired
  // leaflets that shrink toward the tip and ends in a coiled fiddlehead, the young
  // frond still curled tight the way a real fern opens. Continuous on big coprime
  // tiles (127/83) so the fronds run on from cell to cell; a lone square shows a
  // few leaflets, a connected colony a whole unfurling bed.
  // Fern: lush fronds unfurling across the board. Each spine carries pointed,
  // veined leaflets that slant toward the tip and shrink as they go, and every
  // frond ends in a fat two-tone fiddlehead — the young crozier still coiled tight
  // the way a real fern opens. Continuous on big coprime tiles (129/86) so the
  // fronds run on from cell to cell; a lone square shows a few leaflets, a
  // connected colony a whole unfurling bed.
  if(tex==="fern"){const F=n=>(+n).toFixed(1);const base=shade(color,-0.68),rachis=shade(color,-0.08),
      leafA=withA(shade(color,0.38),.96),leafB=withA(shade(color,0.55),.94),
      vein=withA(shade(color,-0.2),.55),coil=shade(color,0.0),coilHi=shade(color,0.3);
    // a pointed, veined leaflet: base (bx,by), angle a, length L, half-width Wd
    const leaf=(bx,by,a,L,Wd,fill)=>{const tx=bx+Math.cos(a)*L,ty=by+Math.sin(a)*L,mx=(bx+tx)/2,my=(by+ty)/2,pa=a+Math.PI/2,
        p1x=mx+Math.cos(pa)*Wd,p1y=my+Math.sin(pa)*Wd,p2x=mx-Math.cos(pa)*Wd,p2y=my-Math.sin(pa)*Wd;
      return `<path d="M${F(bx)} ${F(by)} Q ${F(p1x)} ${F(p1y)} ${F(tx)} ${F(ty)} Q ${F(p2x)} ${F(p2y)} ${F(bx)} ${F(by)} Z" fill="${fill}"/>`
        +`<path d="M${F(bx)} ${F(by)} L ${F(tx)} ${F(ty)}" stroke="${vein}" stroke-width="0.6" fill="none"/>`;};
    // a frond: arcing spine, forward-slanting leaflets, hero fiddlehead at the tip
    const frond=(x0,y0,ang,L,curl,s)=>{const steps=Math.max(7,Math.round(L/6));let x=x0,y=y0,a=ang*Math.PI/180;const pts=[[x,y]];
      for(let i=1;i<=steps;i++){a+=(curl*Math.PI/180)/steps;const seg=L/steps;x+=Math.cos(a)*seg;y+=Math.sin(a)*seg;pts.push([x,y]);}
      let d=`M${F(pts[0][0])} ${F(pts[0][1])}`;for(let i=1;i<pts.length;i++)d+=` L${F(pts[i][0])} ${F(pts[i][1])}`;
      let out=`<path d="${d}" fill="none" stroke="${rachis}" stroke-width="${F(2.1*s)}" stroke-linecap="round"/>`;
      for(let i=1;i<pts.length-1;i++){const t=i/(pts.length-1),[px,py]=pts[i],dir=Math.atan2(pts[i+1][1]-pts[i-1][1],pts[i+1][0]-pts[i-1][0]);
        const ll=(15*s)*(1-0.62*t)+3,wd=(4.4*s)*(1-0.55*t)+0.8,fwd=(38-t*8)*Math.PI/180;
        for(const side of [-1,1])out+=leaf(px,py,dir+side*fwd,ll,wd,(i%2?leafA:leafB));}
      const [tx,ty]=pts[pts.length-1],tdir=Math.atan2(pts[pts.length-1][1]-pts[pts.length-2][1],pts[pts.length-1][0]-pts[pts.length-2][0]);
      let sp=`M${F(tx)} ${F(ty)}`,rr=8.5*s,aa=tdir,cx=tx,cy=ty;
      for(let k=0;k<20;k++){aa+=0.55;rr*=0.86;const nx=cx+Math.cos(aa)*rr,ny=cy+Math.sin(aa)*rr;sp+=` L${F(nx)} ${F(ny)}`;cx=nx;cy=ny;}
      out+=`<path d="${sp}" fill="none" stroke="${coil}" stroke-width="${F(2.6*s)}" stroke-linecap="round" stroke-linejoin="round"/>`;
      return out+`<path d="${sp}" fill="none" stroke="${coilHi}" stroke-width="${F(1*s)}" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>`;};
    const A=`<svg xmlns="http://www.w3.org/2000/svg" width="129" height="129" viewBox="0 0 129 129">
      <rect width="129" height="129" fill="${base}"/>
      ${frond(2,116,-52,92,30,1.15)}${frond(96,129,-108,82,26,1.0)}${frond(129,52,-166,72,22,0.92)}${frond(58,4,26,66,26,0.8)}
    </svg>`;
    const B=`<svg xmlns="http://www.w3.org/2000/svg" width="86" height="86" viewBox="0 0 86 86">
      ${frond(74,84,-146,54,26,0.62)}${frond(6,16,32,48,22,0.56)}
    </svg>`;
    return {background:base,backgroundImage:`${svgBg(B)},${svgBg(A)}`,
      backgroundSize:"86px 86px, 129px 129px",backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.4),.3)}`};}
  // dropped agonized gape, sunken cheeks and temples sculpted with shadow, the head
  // slightly tilted and never quite symmetric. A main visage looms with a fainter
  // one lurking behind it (and a third in the coprime layer), so a connected colony
  // reads as a crowd of the dead pressing out of the fog. All soft-edged with real
  // blur; grid-pinned so a lone square is just drifting smoke.
  if(tex==="spirits"){const base=shade(color,-0.9),glowHi=shade(color,0.62),glowMid=shade(color,0.14),vd=shade(color,-0.97),sculpt=shade(color,-0.92);
    // one face at (cx,cy), scale s, tilt rot, brightness intensity 0..1
    const face=(cx,cy,s,rot,intensity)=>{const S=x=>+(x*s).toFixed(1);const gid="sg"+Math.round(cx*7+cy*13);
      return `<g transform="rotate(${rot} ${cx} ${cy})">
        <radialGradient id="${gid}" cx="50%" cy="40%" r="52%">
          <stop offset="0%" stop-color="${glowHi}" stop-opacity="${(0.62*intensity).toFixed(2)}"/>
          <stop offset="44%" stop-color="${glowMid}" stop-opacity="${(0.25*intensity).toFixed(2)}"/>
          <stop offset="100%" stop-color="${base}" stop-opacity="0"/></radialGradient>
        <ellipse cx="${cx}" cy="${cy}" rx="${S(38)}" ry="${S(53)}" fill="url(#${gid})"/>
        <g filter="url(#sf)" fill="${sculpt}" opacity="${(0.6*intensity).toFixed(2)}">
          <path d="M${cx-S(31)} ${cy-S(4)} q ${S(11)} ${S(24)} ${S(7)} ${S(42)} q ${-S(15)} ${-S(7)} ${-S(17)} ${-S(32)} Z"/>
          <path d="M${cx+S(31)} ${cy-S(4)} q ${-S(11)} ${S(24)} ${-S(7)} ${S(42)} q ${S(15)} ${-S(7)} ${S(17)} ${-S(32)} Z"/>
          <ellipse cx="${cx-S(16)}" cy="${cy-S(25)}" rx="${S(13)}" ry="${S(9)}"/><ellipse cx="${cx+S(16)}" cy="${cy-S(25)}" rx="${S(13)}" ry="${S(9)}"/></g>
        <g filter="url(#sf)" fill="${vd}">
          <ellipse cx="${cx-S(15)}" cy="${cy-S(10)}" rx="${S(13)}" ry="${S(15)}"/><ellipse cx="${cx+S(16)}" cy="${cy-S(9)}" rx="${S(12)}" ry="${S(15)}"/>
          <path d="M${cx-S(4)} ${cy-S(1)} q ${S(4)} ${S(9)} ${S(1)} ${S(13)} q ${-S(5)} ${S(1)} ${-S(7)} ${-S(2)}" opacity="0.75"/>
          <path d="M${cx-S(10)} ${cy+S(21)} q ${S(10)} ${-S(7)} ${S(20)} ${S(1)} q ${-S(3)} ${S(27)} ${-S(12)} ${S(32)} q ${-S(8)} ${-S(6)} ${-S(9)} ${-S(33)} Z"/></g>
      </g>`;};
    const A=`<svg xmlns="http://www.w3.org/2000/svg" width="132" height="132" viewBox="0 0 132 132">
      <defs><filter id="sf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
        <filter id="sf2" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="8"/></filter></defs>
      <rect width="132" height="132" fill="${base}"/>
      <g filter="url(#sf2)" fill="${glowMid}" opacity="0.4"><ellipse cx="108" cy="30" rx="20" ry="30"/><ellipse cx="20" cy="110" rx="24" ry="16"/></g>
      ${face(112,104,0.5,-16,0.5)}${face(60,58,1,-4,1)}
    </svg>`;
    const B=`<svg xmlns="http://www.w3.org/2000/svg" width="87" height="87" viewBox="0 0 87 87">
      <defs><filter id="sf" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6"/></filter></defs>
      ${face(30,52,0.42,12,0.5)}
    </svg>`;
    return {background:base,backgroundImage:`${svgBg(B)},${svgBg(A)}`,
      backgroundSize:"87px 87px, 132px 132px",backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.3),.22)}`};}

  // Watchers: disembodied eyes staring out of the black, at varied sizes and
  // half-closings with gazes pointing every way — the set's most unsettling
  // finish. The iris keeps the seat colour so nations still read at a glance;
  // big coprime tiles (101/67) keep the stare from tiling visibly.
  if(tex==="eyes"){const base=shade(color,-0.82),sclera=withA(shade(color,0.62),.9),iris=shade(color,0.35),
      irisEdge=shade(color,-0.1),pupil=shade(color,-0.95),lid=shade(color,-0.5),glint=withA(shade(color,0.95),.9);
    let uid=0;const F=n=>(+n).toFixed(1);
    // one eye at (cx,cy), width w, openness 0..1, gaze (gx,gy) in -1..1, tilt rot
    const eye=(cx,cy,w,open,gx,gy,rot)=>{const h=w*0.62*open,ir=w*0.32,id="e"+(uid++);
      const gpx=cx+gx*w*0.16,gpy=cy+gy*h*0.5;
      const almond=`M${F(cx-w/2)} ${F(cy)} Q ${F(cx)} ${F(cy-h)} ${F(cx+w/2)} ${F(cy)} Q ${F(cx)} ${F(cy+h)} ${F(cx-w/2)} ${F(cy)} Z`;
      return `<g transform="rotate(${rot} ${F(cx)} ${F(cy)})">
        <path d="${almond}" fill="${sclera}"/>
        <clipPath id="${id}"><path d="${almond}"/></clipPath>
        <g clip-path="url(#${id})">
          <circle cx="${F(gpx)}" cy="${F(gpy)}" r="${F(ir)}" fill="${iris}"/>
          <circle cx="${F(gpx)}" cy="${F(gpy)}" r="${F(ir)}" fill="none" stroke="${irisEdge}" stroke-width="1"/>
          <circle cx="${F(gpx)}" cy="${F(gpy)}" r="${F(ir*0.5)}" fill="${pupil}"/>
          <circle cx="${F(gpx-ir*0.35)}" cy="${F(gpy-ir*0.35)}" r="${F(ir*0.16)}" fill="${glint}"/></g>
        <path d="M${F(cx-w/2)} ${F(cy)} Q ${F(cx)} ${F(cy-h)} ${F(cx+w/2)} ${F(cy)}" fill="none" stroke="${lid}" stroke-width="${F(w*0.08)}" stroke-linecap="round"/>
        <path d="M${F(cx-w/2)} ${F(cy)} Q ${F(cx)} ${F(cy+h)} ${F(cx+w/2)} ${F(cy)}" fill="none" stroke="${lid}" stroke-width="${F(w*0.06)}" stroke-linecap="round" opacity="0.7"/>
      </g>`;};
    const A=`<svg xmlns="http://www.w3.org/2000/svg" width="101" height="101" viewBox="0 0 101 101">
      <rect width="101" height="101" fill="${base}"/>
      ${eye(22,20,26,1,-0.5,-0.2,-4)}${eye(66,16,20,0.7,0.3,0.1,6)}${eye(84,44,24,1,-0.2,0.3,-8)}
      ${eye(40,52,30,1,0.1,-0.1,3)}${eye(14,74,20,0.55,0.6,0,-10)}${eye(60,80,26,1,-0.3,-0.3,8)}${eye(90,80,16,0.4,0,0.4,0)}
    </svg>`;
    const B=`<svg xmlns="http://www.w3.org/2000/svg" width="67" height="67" viewBox="0 0 67 67">
      ${eye(18,40,16,0.5,0.4,0,12)}${eye(48,14,14,0.85,-0.4,0.2,-12)}${eye(54,52,12,0.35,0,0,0)}
    </svg>`;
    return {background:base,backgroundImage:`${svgBg(B)},${svgBg(A)}`,
      backgroundSize:"67px 67px, 101px 101px",backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.4),.3)}`};}

  // Dead Channel: a lost monochrome broadcast. Faceless figures surface between
  // torn scan lines and tracking faults; there are no eyes or literal monsters,
  // just the suggestion that something has been standing inside the signal.
  if(tex==="deadchannel"){const base=shade(color,-0.94),snow=withA(shade(color,0.72),.72),ghost=withA(shade(color,0.25),.62),black=shade(color,-0.99),hot=withA(shade(color,0.9),.9);
    const figure=(x,y,s,tilt,op)=>`<g transform="translate(${x} ${y}) rotate(${tilt}) scale(${s})" opacity="${op}">
      <ellipse cx="0" cy="-18" rx="7" ry="10" fill="${ghost}"/><path d="M-9 -9 Q0 -15 9 -9 L13 25 L-13 25 Z" fill="${ghost}"/>
      <rect x="-5" y="-22" width="10" height="6" rx="3" fill="${black}" opacity=".65"/></g>`;
    const A=`<svg xmlns="http://www.w3.org/2000/svg" width="131" height="131" viewBox="0 0 131 131">
      <rect width="131" height="131" fill="${base}"/>
      <g fill="${snow}" opacity=".28"><rect y="8" width="131" height="2"/><rect y="18" x="15" width="96" height="1"/><rect y="44" width="72" height="3"/><rect y="73" x="23" width="108" height="2"/><rect y="101" width="131" height="1"/><rect y="116" x="9" width="89" height="4"/></g>
      ${figure(33,51,.82,-5,.8)}${figure(101,96,.58,7,.45)}
      <path d="M0 62 L20 58 L37 66 L58 59 L77 65 L98 57 L131 63" fill="none" stroke="${hot}" stroke-width="2" opacity=".46"/>
      <g fill="${snow}" opacity=".4"><rect x="4" y="28" width="18" height="2"/><rect x="80" y="31" width="43" height="1"/><rect x="7" y="91" width="51" height="2"/><rect x="92" y="124" width="27" height="2"/></g></svg>`;
    const B=`<svg xmlns="http://www.w3.org/2000/svg" width="79" height="79" viewBox="0 0 79 79">
      <g stroke="${snow}" opacity=".3"><path d="M0 6 H79 M0 22 H79 M0 39 H79 M0 67 H79"/><path d="M5 0 V79 M57 0 V79" opacity=".14"/></g>
      <g fill="${hot}" opacity=".32"><rect x="8" y="12" width="21" height="3"/><rect x="43" y="48" width="30" height="2"/><rect x="17" y="71" width="38" height="2"/></g></svg>`;
    return {background:base,backgroundImage:`${svgBg(B)},${svgBg(A)}`,
      backgroundSize:"79px 79px, 131px 131px",backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.2),.24)}`};}

  // The Threshold: impossible doors, severed staircases and shadows that point
  // toward entrances which do not share the same perspective. Architectural
  // unease rather than gore — a whole colony becomes one endless wrong hallway.
  if(tex==="threshold"){const base=shade(color,-0.96),frame=withA(shade(color,0.5),.88),dim=withA(shade(color,0.1),.55),voidC=shade(color,-0.995),light=withA(shade(color,0.88),.82);
    const door=(x,y,w,h,lean)=>`<g transform="skewY(${lean})"><path d="M${x} ${y+h} V${y} H${x+w} V${y+h}" fill="none" stroke="${frame}" stroke-width="3"/>
      <rect x="${x+5}" y="${y+6}" width="${w-10}" height="${h-6}" fill="${voidC}"/><path d="M${x+w/2} ${y+h} L${x+w+18} ${y+h+19} L${x-15} ${y+h+19} Z" fill="${dim}"/></g>`;
    const A=`<svg xmlns="http://www.w3.org/2000/svg" width="137" height="137" viewBox="0 0 137 137">
      <rect width="137" height="137" fill="${base}"/>
      ${door(13,15,34,58,-4)}${door(89,62,27,47,5)}
      <g fill="none" stroke="${light}" stroke-width="2" opacity=".72"><path d="M52 126 H91 V117 H59 V108 H84 V99 H66 V90 H80"/><path d="M0 43 L29 57 L0 71"/></g>
      <path d="M54 0 L72 32 L61 65 L79 94 L68 137" fill="none" stroke="${frame}" stroke-width="1.5" opacity=".38"/>
      <circle cx="108" cy="84" r="1.8" fill="${light}"/></svg>`;
    const B=`<svg xmlns="http://www.w3.org/2000/svg" width="83" height="83" viewBox="0 0 83 83">
      <g fill="none" stroke="${dim}" stroke-width="1.4"><path d="M7 78 L39 45 L76 79"/><path d="M15 4 H66 V33 H15 Z"/><path d="M25 12 H56 V39 H25 Z"/></g>
      <path d="M41 39 V83" stroke="${light}" stroke-width="1" opacity=".45"/></svg>`;
    return {background:base,backgroundImage:`${svgBg(B)},${svgBg(A)}`,
      backgroundSize:"83px 83px, 137px 137px",backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.32),.25)}`};}

  // Vortex: a Twilight-Zone hypnotic swirl — a bold double spiral of the seat
  // colour winding into a black pupil at the centre, with a fainter counter-
  // rotating spiral over it so the whole thing shimmers and pulls the eye in. Pure
  // geometry, high contrast, and continuous, so a connected colony reads as one
  // giant vortex opening in the board.
  if(tex==="vortex"){const F=n=>(+n).toFixed(1);const base=shade(color,-0.86),arm=shade(color,0.55),arm2=withA(shade(color,0.3),.5),pupil=shade(color,-0.97);
    // an N-arm spiral centred (cx,cy) out to Rmax; consecutive arms sit S apart so
    // stroking each arm at ~half that width gives equal light bands and dark gaps
    const spiral=(cx,cy,Rmax,S,arms,dir,stroke,sw)=>{const growth=S*arms/(2*Math.PI),Tmax=Rmax/growth;let out="";
      for(let k=0;k<arms;k++){const ph=k*2*Math.PI/arms;let d="";
        for(let t=0;t<=Tmax;t+=0.14){const r=growth*t,x=cx+Math.cos(dir*t+ph)*r,y=cy+Math.sin(dir*t+ph)*r;d+=(t===0?"M":"L")+F(x)+" "+F(y)+" ";}
        out+=`<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${F(sw)}" stroke-linecap="round"/>`;}return out;};
    const S=11,swN=S*0.52;
    const A=`<svg xmlns="http://www.w3.org/2000/svg" width="130" height="130" viewBox="0 0 130 130">
      <rect width="130" height="130" fill="${base}"/>
      ${spiral(65,65,96,S,2,1,arm,swN)}
      <circle cx="65" cy="65" r="4.5" fill="${pupil}"/>
    </svg>`;
    const B=`<svg xmlns="http://www.w3.org/2000/svg" width="87" height="87" viewBox="0 0 87 87">
      ${spiral(43,43,70,S*1.15,2,-1,arm2,swN*0.7)}
    </svg>`;
    return {background:base,backgroundImage:`${svgBg(B)},${svgBg(A)}`,
      backgroundSize:"87px 87px, 130px 130px",backgroundAttachment:"fixed",
      boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.4),.3)}`};}

  /* ---- CONTINUOUS TRIO (reward connected territory) -----------------------
     These lean into the one-illustration-across-territory idea: each is grid-
     pinned so the pattern only resolves into a whole picture when your pieces
     actually connect. Isolated cells show fragments; a big linked colony shows
     the full design. That makes the skin itself reward good play.          */

  // Constellation: a star map. Scattered stars joined by faint connecting lines,
  // so a large connected territory reveals a whole constellation while a lone
  // cell shows just a star or two.
  if(tex==="constellation"){const star=withA(shade(color,0.95),1),dim=withA(shade(color,0.6),.7),
      line=withA(shade(color,0.5),.4),base=shade(color,-0.72);
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
      <rect width="64" height="64" fill="${base}"/>
      <g stroke="${line}" stroke-width="0.8" fill="none">
        <path d="M8 12 L 28 20 L 40 8 L 58 18 M28 20 L 34 40 L 20 52 M40 8 L 56 40 L 34 40 M56 40 L 60 58 M20 52 L 8 60 M8 12 L 4 32 L 20 52"/></g>
      <g fill="${star}">
        <circle cx="28" cy="20" r="1.9"/><circle cx="40" cy="8" r="1.6"/><circle cx="34" cy="40" r="2.1"/>
        <circle cx="56" cy="40" r="1.7"/><circle cx="20" cy="52" r="1.8"/></g>
      <g fill="${dim}">
        <circle cx="8" cy="12" r="1.2"/><circle cx="58" cy="18" r="1.1"/><circle cx="4" cy="32" r="1"/>
        <circle cx="60" cy="58" r="1.1"/><circle cx="8" cy="60" r="1"/>
        <circle cx="48" cy="28" r="0.7"/><circle cx="16" cy="34" r="0.7"/><circle cx="44" cy="52" r="0.7"/></g>
    </svg>`;
    return {background:base,backgroundImage:svgBg(svg),backgroundSize:"64px 64px",
      backgroundAttachment:"fixed",boxShadow:`inset 0 0 0 1px ${withA(color,.3)}`};}

  // Circuitry Flow: like Circuit but the traces carry a directional current — a
  // brighter "flowing" line inside each trace — so a connected colony reads as a
  // powered board and isolated cells read as dead ends.
  if(tex==="flow"){const trace=withA(shade(color,0.4),.7),live=withA(shade(color,0.95),.95),
      base=shade(color,-0.6);
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
      <rect width="48" height="48" fill="${base}"/>
      <g fill="none" stroke-linecap="round">
        <path d="M0 24 L 16 24 L 16 8 L 32 8 L 32 24 L 48 24" stroke="${trace}" stroke-width="4"/>
        <path d="M24 48 L 24 32 L 40 32 L 40 48 M0 40 L 12 40 L 12 24" stroke="${trace}" stroke-width="4"/>
        <path d="M0 24 L 16 24 L 16 8 L 32 8 L 32 24 L 48 24" stroke="${live}" stroke-width="1.4"/>
        <path d="M24 48 L 24 32 L 40 32 L 40 48 M0 40 L 12 40 L 12 24" stroke="${live}" stroke-width="1.4"/></g>
      <g fill="${live}"><circle cx="16" cy="24" r="2.4"/><circle cx="32" cy="8" r="2.2"/>
        <circle cx="24" cy="32" r="2.2"/><circle cx="12" cy="40" r="2"/></g>
      <g fill="${base}"><circle cx="16" cy="24" r="1"/><circle cx="32" cy="8" r="1"/><circle cx="24" cy="32" r="1"/></g>
    </svg>`;
    return {background:base,backgroundImage:svgBg(svg),backgroundSize:"48px 48px",
      backgroundAttachment:"fixed",boxShadow:`inset 0 0 6px ${withA(shade(color,0.5),.3)}`};}

  // River Delta: branching waterways that split as they cross the territory, like
  // a river fanning into a delta. A big colony shows the whole braided river; a
  // single cell shows one channel passing through.
  if(tex==="delta"){const water=withA(shade(color,0.7),.85),deep=withA(shade(color,0.4),.6),
      bank=shade(color,-0.35),base=shade(color,-0.1);
    const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" viewBox="0 0 56 56">
      <rect width="56" height="56" fill="${base}"/>
      <g fill="none" stroke="${bank}" stroke-width="6" stroke-linecap="round">
        <path d="M0 28 L 20 28 M20 28 L 38 14 M20 28 L 38 42 M38 14 L 56 8 M38 14 L 56 20 M38 42 L 56 48 M38 42 L 56 36"/></g>
      <g fill="none" stroke="${water}" stroke-width="3" stroke-linecap="round">
        <path d="M0 28 L 20 28 M20 28 L 38 14 M20 28 L 38 42 M38 14 L 56 8 M38 14 L 56 20 M38 42 L 56 48 M38 42 L 56 36"/></g>
      <g fill="none" stroke="${deep}" stroke-width="1" stroke-linecap="round">
        <path d="M0 28 L 20 28 M20 28 L 38 14 M20 28 L 38 42"/></g>
    </svg>`;
    return {background:base,backgroundImage:svgBg(svg),backgroundSize:"56px 56px",
      backgroundAttachment:"fixed",boxShadow:`inset 0 0 0 1px ${withA(shade(color,0.3),.3)}`};}

/* ---- DAILY CHALLENGE -------------------------------------------------------
   One fixed setup per calendar day, identical for every player: same board,
   same nation, same opponents, same difficulty. CPU play still varies turn to
   turn (their randomness is live), so this is "same puzzle, chase your best
   score", not a deterministic replay. Everything derives from the date string,
   so no storage or server is needed to agree on today's challenge.            */
const dayKey=(d)=>{d=d||new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;};

function hashStr(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

// 2x boards come up most; 3x boards are longer games so they appear less; twin
// boards are the most demanding format of all and trail everything. Weights are
// integers so the deterministic pick below stays exact.
const DAILY_MAP_W=MAP_IDS.filter(id=>!MAPS[id].cube).map(id=>{const m=MAPS[id];
  const copies=(m.build().copies)||1;
  if(m.twin)return{id,w:4};                    // rarest: two dishes and a seam to cross
  return{id,w:copies>=3?6:10};});              // 3x boards are long, so slightly rarer
const DAILY_MAPS=DAILY_MAP_W.map(x=>x.id);
const DAILY_W_TOTAL=DAILY_MAP_W.reduce((a,x)=>a+x.w,0);
// Deterministic weighted choice: walk the weights with a value derived from the
// day's hash, so everyone lands on the same board without any randomness.
function pickDailyMap(h){let n=h%DAILY_W_TOTAL;
  for(const x of DAILY_MAP_W){if(n<x.w)return x.id;n-=x.w;}
  return DAILY_MAP_W[0].id;}
const DAILY_BRAINS=["normal","hard","expert","petri"];
function dailySetup(key,reroll){key=key||dayKey();
  // `reroll` is a dev-only nudge: it changes the seed without changing the day,
  // so today's challenge can be regenerated for testing. Zero in normal play, so
  // everyone still shares one position per day.
  const h=hashStr(key+(reroll?"#"+reroll:""));
  const pick=(arr,shift)=>arr[(h>>>shift)%arr.length];
  const count=3+((h>>>3)%2);                       // 3 or 4 seats — never a 1v1 daily
  const brain=DAILY_BRAINS[(h>>>11)%DAILY_BRAINS.length];
  // Your nation, then distinct opponents walked deterministically around the list.
  const myCiv=pick(CIV_IDS,17);
  const start=CIV_IDS.indexOf(myCiv);
  const civs=[myCiv];
  for(let i=1;i<count;i++)civs.push(CIV_IDS[(start+i*7+((h>>>5)%5))%CIV_IDS.length]);
  // The handicap tier rotates too, so some days are a fair fight and some drop
  // you into a hole. Weighted toward the middle: mostly Behind/Pinned.
  // Every day is handicapped now — a clean board is just a normal game, and the
  // comeback is the entire point of the daily. Weighted toward the middle.
  // Rotate the four challenge TYPES. Teammate only on team-eligible days handled
  // below; the rest spread evenly with a slight lean toward Even/Contested.
  // even / contested / puzzle only for now. "teammate" (index 3) is defined but
  // needs the daily to force team mode with a fixed pairing, which isn't wired
  // yet — leaving it out of the rotation until it is, rather than shipping a
  // teammate day that plays like a normal one.
  const base=DAILY_TIERS[[0,1,2,0,1,2,0,2,1,1][(h>>>13)%10]];
  // The handicap scales down as seats are added. A 20x20 board fits two full
  // trays with room to spare, so at 1v1 a lost tempo is recoverable and the skip
  // has to be large to bite. With three or four colonies the board is genuinely
  // crowded, every turn you miss is territory you never get back, and the same
  // skip would be an execution rather than a challenge.
  // Depth scales a little with crowding so a 4-player board isn't over-filled,
  // but skip is NOT scaled up any more — the deficit cap does the limiting now.
  const scale=count>=4?1.3:count===3?1.15:1;
  // ...and up with the size of the board. A 3x board lets a colony reach ~267
  // squares, so falling ten behind there is nothing, while the same ten is a
  // real hole on a standard 89-point board. Scaling by piece copies keeps the
  // handicap proportional to what's actually winnable.
  const mapId=pickDailyMap(hashStr(key+"map"+(reroll||0)));
  const cop=(MAPS[mapId].build().copies)||1;
  const extraDepth=base.kind==="puzzle"?9:base.kind==="contested"?5:3;

          // Independent hash per seat: shifting one hash by a few bits per seat
          // left neighbouring seats correlated, which paired them up A,B,A,B.
          powerIds:Array.from({length:4},(_,i)=>POWER_IDS[hashStr(key+"pw"+i+(reroll||0))%POWER_IDS.length]),
          tier,seed:h};

/* ---- DAILY HANDICAP --------------------------------------------------------

    // leading, advance the strongest rival with the smallest legal correction.
    guard=0;while(leaderScore()-myScore()<2&&guard++<5){const leader=rivals.slice().sort((a,b)=>scoreOf(b)-scoreOf(a))[0];if(!placeMove(leader,{maxSize:2}))break;}
    // Re-apply the absolute ceiling in case that last legal piece was larger than
    // requested because no tiny shape fit the position.
    guard=0;while(leaderScore()-myScore()>DAILY_CAP&&guard++<6){if(!placeMove(weakSeat,{maxSize:3}))break;}
    // Final stabilization: every opponent must individually lead the player,
    // while equal-turn / one-turn-behind positions retain the five-point cap.
    for(let cycle=0;cycle<12;cycle++){
      let changed=false;
      for(const rival of rivals)if(scoreOf(rival)<=myScore()){
        if(placeMove(rival,{maxSize:2}))changed=true;
      }
      const mostPieces=Math.max(...rivals.map(piecesOf));
      if(leaderScore()-myScore()>5&&piecesOf(weakSeat)>=mostPieces-1){
        if(placeMove(weakSeat,{maxSize:3}))changed=true;
      }else if(leaderScore()-myScore()>DAILY_CAP){
        if(placeMove(weakSeat,{maxSize:3}))changed=true;
      }
      if(!changed)break;
    }
    // Strict last word: the player begins behind every individual opponent.
    // This runs after all player catch-up corrections, so nothing can undo it.
    for(const rival of rivals){
      guard=0;while(scoreOf(rival)<=myScore()&&guard++<4){
        if(!placeMove(rival,{maxSize:2}))break;
      }
    }
    const sc=tally();
    return {board:b,specials:sp,used,deficit:Math.max(...sc.slice(1))-sc[0],
            mine:sc[0],lead:Math.max(...sc.slice(1)),scores:sc,kind,
            placed:Array.from({length:count},(_,i)=>piecesOf(i+1))};});}

// The streak compares against the day before `key` itself (not before "now"),
// so it stays correct regardless of when the record is written.
const prevDayKey=k=>{const p=k.split("-").map(Number);
  const d=new Date(p[0],p[1]-1,p[2]);d.setDate(d.getDate()-1);return dayKey(d);};
function recordDaily(save,key,score,won,startedBehind){
  const daily={...save.daily};
  const prev=daily[key]||{best:0,won:false,plays:0};
  const firstWinToday=!!won&&!prev.won;             // first time WINNING this day
  daily[key]={best:Math.max(prev.best,score),won:prev.won||!!won,plays:prev.plays+1};
  const s={...save,daily};
  if(!prev.plays){                                  // first ATTEMPT on this day
    s.dailyDays=(save.dailyDays||0)+1;
    s.dailyStreak=(save.dailyLast===prevDayKey(key))?(save.dailyStreak||0)+1:1;
    if(s.dailyStreak>(save.dailyBestStreak||0))s.dailyBestStreak=s.dailyStreak;
    s.dailyLast=key;}
  if(firstWinToday){                                // first WIN on this day
    s.dailyWins=(save.dailyWins||0)+1;
    // consecutive-day daily WIN streak (distinct from play streak)
    s.dailyWinStreak=(save.dailyWinLast===prevDayKey(key)||save.dailyWinLast===key)?(save.dailyWinStreak||0)+1:1;
    if(s.dailyWinStreak>(save.dailyWinBest||0))s.dailyWinBest=s.dailyWinStreak;
    s.dailyWinLast=key;
    if(startedBehind)s.comebacks=(save.comebacks||0)+1;   // won a daily from behind
  }
  return s;}
