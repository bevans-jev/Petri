const PROFILE_ALIAS_RIGHT=["inator","Farcious","Merchant","Adjacent","Deluxe","Prime","Coded","Geeker","Tech","Cheddie"];
const PROFILE_INGTON=["Chudington","Bangoutington","Farcington"];
function fallbackName(save){const used=new Set([...(save.usedNames||[]),save.name||""].map(n=>n.toLowerCase()));
  for(let tries=0;tries<250;tries++){const a=PROFILE_ALIAS_LEFT[Math.floor(Math.random()*PROFILE_ALIAS_LEFT.length)],b=PROFILE_ALIAS_RIGHT[Math.floor(Math.random()*PROFILE_ALIAS_RIGHT.length)],ington=PROFILE_INGTON[Math.floor(Math.random()*PROFILE_INGTON.length)],style=Math.floor(Math.random()*6);
    let n=style===0?`${a}${b}`:style===1?`${a}_${b}`:style===2?`${a} ${b}`:style===3?ington:style===4?`${ington} ${b}`:`${a} ${ington}`;
    n=cleanName(n);if(n&&!used.has(n.toLowerCase()))return n;}
  return "Fresh Farcious Culture";}
function moderateName(raw,save){const cleaned=cleanName(raw);return blockedName(cleaned)?{name:fallbackName(save),replaced:true}:{name:cleaned,replaced:false};}
const displayName=save=>(save&&save.name)?save.name:"Unnamed Colony";

// Textures grouped for the picker. Free finishes first, then the earned ones in
// roughly the order they unlock, then the four showpieces.
const TEX_GROUPS=[
  ["ALWAYS YOURS",["flat","cells","cross"]],
  ["MARKS",["triangle","hex","star","ring","blade","bolt","colony","outline"]],
  ["BOLD SHAPES",["chevron","scales","rings","crystal","circuit","camo"]],
  ["LIVING",["coral","kelp","lichen","vines","flowers","blossom","fern","tissue","mycelium","biolum"]],
  ["HAUNTED",["spirits","eyes","deadchannel","threshold","vortex"]],
  ["CONNECTED",["constellation","flow","delta","aurora","web","weave"]],
  ["EARNED",["seamless","foil","kintsugi","halftone","plasma","marble"]],
  ["LEGENDARY",["gold","wootz","diamond","infected"]],
];
// Safety net: the groups above are hand-written, so a finish added later could
// silently never appear in the picker. Anything unlisted gets swept into its own
// group rather than disappearing.
(()=>{const listed=new Set(TEX_GROUPS.flatMap(g=>g[1]));
  const rest=Object.keys(PIECE_TEX).filter(id=>!listed.has(id));
  if(rest.length)TEX_GROUPS.push(["OTHER",rest]);})();

const chById=id=>CHALLENGES.find(c=>c.id===id);
const isThemeLocked=(save,id)=>!(save&&save.override)&&!!THEME_LOCKS[id]&&!challengeDone(save,chById(THEME_LOCKS[id]));
// A texture gate can be a single challenge id OR an array of ids (all required).
function texGateDone(save,gate){
  if(!gate)return true;
  const ids=Array.isArray(gate)?gate:[gate];
  return ids.every(id=>challengeDone(save,chById(id)));
}
const isTexLocked=(save,id)=>!(save&&save.override)&&!!TEX_LOCKS[id]&&!texGateDone(save,TEX_LOCKS[id]);
// A gate is a single challenge id or an array of them (all required). The old
// version passed the whole array to chById, which only matches a single id, so
// every multi-challenge finish silently fell back to the bare word "Locked".
// Now each requirement is looked up and its description joined, so a skin like
// Gold reads "Win 100 games.  +  Win a game by 40 or more." instead of "Locked".
const lockHint=(id,map)=>{const g=map&&map[id];if(!g)return "Locked";
  const descs=(Array.isArray(g)?g:[g]).map(i=>{const c=chById(i);return c&&c.desc;}).filter(Boolean);
  return descs.length?descs.join("  +  "):"Locked";};
// Returns [updatedSave, newlyCompleted[]] so the UI can toast fresh unlocks once.
function harvestUnlocks(save){const fresh=CHALLENGES.filter(c=>!save.claimed.includes(c.id)&&c.test(save));
  if(!fresh.length)return[save,[]];
  return[{...save,unlocked:[...new Set([...save.unlocked,...fresh.map(c=>c.id)])],
    claimed:[...new Set([...save.claimed,...fresh.map(c=>c.id)])]},fresh];}

function Leaderboards(){const T=THEME;const [ladder,setLadder]=useState("blitz"),[culture,setCulture]=useState(CIV_IDS[0]),[cultureOpen,setCultureOpen]=useState(false),[rows,setRows]=useState([]),[loading,setLoading]=useState(true),[loadError,setLoadError]=useState("");

    let q=PETRI_SUPABASE.from(table).select(cultureBoard?"user_id,culture_id,games,wins":"user_id,mode,mmr,games,wins");q=cultureBoard?q.eq("culture_id",culture).order("wins",{ascending:false}).order("games",{ascending:false}):q.eq("mode",ladder).gt("games",0).order("mmr",{ascending:false}).order("wins",{ascending:false});
    const {data:records,error}=await q.limit(25);if(error){if(alive){setLoadError("Could not load the live leaderboard.");setRows([]);setLoading(false);}return;}
    const ids=[...new Set((records||[]).map(r=>r.user_id))];let profiles=[];if(ids.length){const p=await PETRI_SUPABASE.from("profiles").select("id,username,avatar_index").in("id",ids);if(p.error){if(alive){setLoadError("Could not load player names.");setRows([]);setLoading(false);}return;}profiles=p.data||[];}
    const byId=Object.fromEntries(profiles.map(p=>[p.id,p]));const merged=(records||[]).filter(r=>byId[r.user_id]).map(r=>({...r,name:byId[r.user_id].username,avatar:byId[r.user_id].avatar_index}));if(alive){setRows(merged);setLoading(false);}})();return()=>{alive=false;};},[ladder,culture]);
  const shown=rows,cultureBoard=ladder==="culture";
  return <div><div style={{...card,padding:16,marginBottom:11}}><div><div style={{fontFamily:T.mono,fontSize:10,color:T.accent,letterSpacing:1.8}}>COMPETITIVE RECORDS · TOP 25</div><div style={{fontFamily:T.display,fontSize:24,fontWeight:600,marginTop:2}}>Leaderboards</div><div style={{fontSize:12,color:T.muted,marginTop:3}}>Blitz and Full use their own MMR ladders. Culture leaders are ranked only by total wins with that culture.</div></div></div>

// ===== 8c. CLOCKS ===========================================================
/* Chess-style clocks: each seat gets a total budget for the whole game plus an
   increment credited after every placement, rather than a fixed allowance per
   turn. That is the right model here for the same reason it is in chess — you
   can bank time by moving quickly in the opening and spend it on the tight
   middlegame, and the increment stops anyone losing a won position purely to
   the clock.

   Pure functions only. The same code has to run on a server later, because a
   clock the client controls is a clock the client can stop.                  */
const TIME_CONTROLS={
  none:  {name:"No clock", short:"—",   budget:0,         inc:0},
  blitz: {name:"Blitz",    short:"5m",  budget:5*60000,   inc:0},
  rapid: {name:"Rapid",    short:"10m", budget:10*60000,  inc:0},
  long:  {name:"Long",     short:"15m", budget:15*60000,  inc:0},
};
const TC_IDS=Object.keys(TIME_CONTROLS);

function newClocks(count,tcId){const tc=TIME_CONTROLS[tcId]||TIME_CONTROLS.none;
  const c={};for(let s=1;s<=count;s++)c[s]=tc.budget;return c;}
// Time left for `seat` right now. Only the seat on move is burning time, and
// only the elapsed part of the current turn is subtracted — the stored value is
// never mutated by a tick, so a re-render can't quietly drain someone's clock.
function clockLeft(clocks,seat,turn,turnStart,now,running){
  const base=clocks[seat]||0;
  // turnStart<=0 means no turn is being timed yet; only bail on that, not on a
  // legitimately small timestamp.
  if(!running||seat!==turn||turnStart<=0)return base;
  return Math.max(0,base-Math.max(0,now-turnStart));}
// Commit the elapsed time when a seat finishes its turn, then credit increment.
function commitClock(clocks,seat,turnStart,now,inc){
  const spent=turnStart?Math.max(0,now-turnStart):0;
  const left=Math.max(0,(clocks[seat]||0)-spent);
  return {...clocks,[seat]:left>0?left+inc:0};}
const fmtClock=ms=>{if(ms<=0)return "0:00";
  const t=Math.ceil(ms/1000),m=Math.floor(t/60),sec=t%60;
  return m+":"+String(sec).padStart(2,"0");};

  useEffect(()=>{if(selId!=null&&(used[turn]?.[selId]||0)>=copies){setSel(null);setSelId(null);setTent(null);selRef.current=null;}},[used,turn,selId,copies]);
  // Lebanon's Byblos Alphabet: start an inscription. Every piece after this must be
  // larger than the last; each one is a letter worth +2, and a smaller piece ends it.
  function toggleDye(){if(traitUsed[turn]||!curHuman()||over)return;if(placed(turn)<1){flash("Place your first piece before using an ability.");return;}
    setScribe({seat:turn,lastSize:null,letters:0});setTraitUsed(t=>({...t,[turn]:true}));
    flash("The inscription begins. Your next piece cuts the opening letter, and every letter after it must be larger, +2 each.");vib(12);}
  // Spain's Castells: arm, then place a piece standing entirely on your own squares.
  function toggleCastell(){if(traitUsed[turn]||!curHuman()||over)return;if(placed(turn)<1){flash("Place your first piece before using an ability.");return;}
    if(castellArmed){setCastellArmed(false);flash("Castells off");return;}
    setArmed(false);setTargeting(null);setCastellArmed(true);
    flash("Castells! Place a piece standing entirely on your own squares, it counts twice.");}
  // Nicaragua's Momotombo: tap one of your own pieces; it erupts, taking rivals with it.
  function toggleErupt(){if(traitUsed[turn]||!curHuman()||over)return;if(placed(turn)<1){flash("Place your first piece before using an ability.");return;}
    if(eruptPick){setEruptPick(false);flash("Momotombo off");return;}
    setArmed(false);setTargeting(null);setEruptPick(true);
    flash("Momotombo, tap one of your own squares. That piece erupts and takes its rival neighbours with it.");}
  // USA's Melting Pot: take the shape a rival just played and make it your own, free.
  function toggleMeltingPot(){if(traitUsed[turn]||!curHuman()||over)return;if(placed(turn)<1){flash("Place your first piece before using an ability.");return;}
    if(potArmed){setPotArmed(false);flash("Melting Pot off");return;}
    if(!lastShape||!PIECES[lastShape]){flash("Nothing to take yet, wait for a rival to play a shape.");return;}
    setArmed(false);setTargeting(null);setPotArmed(true);
    const o=norm(PIECES[lastShape]);setSel(o);selRef.current=o;setSelId(lastShape);
    if(mob){const [r,c]=initialDrop(o);const tc=anchorWith(o,r,c);setTent({cells:tc,id:lastShape,r,c,ok:valid(board,tc,turn,false,startOf(turn),humanX())});}
    flash(`Melting Pot! Their ${lastShape} is yours now, free of charge.`);}
  // Kenya's The Kick: the runner's surge from behind. Free squares scaled to how far it trails.
  function useKick(){if(traitUsed[turn]||!curHuman()||over)return;if(placed(turn)<1){flash("Place your first piece before using an ability.");return;}
    const s=turn,mine=scoreOf(s);let lead=mine;for(let i=1;i<=count;i++)if(i!==s&&!matesOf(s).has(i))lead=Math.max(lead,scoreOf(i));
    const gap=lead-mine,n=Math.min(6,Math.floor(gap/4));
    if(n<1){flash("The kick is for chasing, you are not behind enough to need it yet.");return;}
    const nb=cloneB(live.current.board);let got=0;
    for(let k=0;k<n;k++){const sp2=bioSprout(nb,s,specials);if(!sp2)break;nb[sp2[0]][sp2[1]]=s;got++;}
    if(!got){flash("No open ground for the community to build on.");return;}
    setBoard(nb);setTraitUsed(t=>({...t,[s]:true}));
    flash(`The Kick! You surge from behind, ${got} free square${got>1?"s":""} gained.`);vib(14);}
  // Brazil's Carnival: arm/disarm; consumed on the next placement.
  function toggleCarnival(){if(traitUsed[turn]||!curHuman()||over)return;if(placed(turn)<1){flash("Place your first piece before using an ability.");return;}
    setCarnArmed(a=>!a);flash(carnArmed?"Carnival off":"Carnival! Your next piece may link off any color.");}
  // Chile's Miner: arm/disarm; consumed on the next placement.
  function toggleMiner(){if(traitUsed[turn]||!curHuman()||over)return;if(placed(turn)<1){flash("Place your first piece before using an ability.");return;}
    setMinerArmed(a=>!a);flash(minerArmed?"Miner off":"Miner! Your next piece may link off the map's walls.");}
  // Nepal's Himalayan Ascent: arm/disarm; the next piece climbs over anything.
  function toggleAscent(){if(traitUsed[turn]||!curHuman()||over)return;if(placed(turn)<1){flash("Place your first piece before using an ability.");return;}
    setAscentArmed(a=>!a);flash(ascentArmed?"Ascent off":"Himalayan Ascent! Your next piece may climb over walls and rivals.");}
  // Guatemala's Long Count: arm/disarm; placing your next piece grants an extra placement.
  function toggleLongCount(){if(traitUsed[turn]||!curHuman()||over)return;if(placed(turn)<1){flash("Place your first piece before using an ability.");return;}
    setLcArmed(a=>!a);flash(lcArmed?"Long Count off":"Long Count! Place your next piece, then place one more.");}
  // Botswana's Okavango: arm/disarm; your next placement floods, claiming open ground.
  function toggleOkavango(){if(traitUsed[turn]||!curHuman()||over)return;if(placed(turn)<1){flash("Place your first piece before using an ability.");return;}
    if(okaArmed){setOkaArmed(false);setFloodPick([]);flash("Okavango off");return;}
    setArmed(false);setTargeting(null);setCaravanMode(false);setOkaArmed(true);setFloodPick([]);
    flash("Okavango! Tap 5 open squares touching your colony to flood them.");}
  // Commit the tapped Okavango squares: they flood, block everyone and score +5 for 2 turns, then vanish.
  function commitFlood(picks){const s=turn;const nb=cloneB(live.current.board);for(const [r,c] of picks)nb[r][c]=-3;
    setBoard(nb);setFloods(f=>[...f,{seat:s,cells:picks,turnsLeft:2}]);setTraitUsed(t=>({...t,[s]:true}));setOkaArmed(false);setFloodPick([]);
    flash(`Okavango floods ${picks.length} squares (+${picks.length} while they hold), sealed for 2 turns.`);}
  // Malta's Great Siege: with rivals pressing on its colony, break the siege and
  // raise their positions into Malta's own ramparts (Valletta's famous walls).
  const SIEGE_MIN=3,SIEGE_MAX=5; // it takes a real siege, not one stray neighbour
  function toggleSiege(){if(traitUsed[turn]||!curHuman()||over)return;if(placed(turn)<1){flash("Place your first piece before using an ability.");return;}
    if(siegeMode){setSiegeMode(false);setSiegePick([]);flash("Great Siege off");return;}
    const bes=besiegersOf(board,turn,matesOf(turn));
    if(bes.length<SIEGE_MIN){flash(`Not yet besieged, ${SIEGE_MIN} rival squares must press your colony (now ${bes.length}).`);return;}
    setArmed(false);setTargeting(null);setOkaArmed(false);setCaravanMode(false);setSiegeMode(true);setSiegePick([]);
    flash(`Great Siege! Tap up to ${SIEGE_MAX} enemy squares, chaining out from your colony or your breach.`);}
  function commitSiege(picks){const s=turn;const nb=cloneB(live.current.board);for(const [r,c] of picks)nb[r][c]=-1;
    setBoard(nb);setForts(f=>[...f,{seat:s,cells:picks}]);setTraitUsed(t=>({...t,[s]:true}));setSiegeMode(false);setSiegePick([]);
    flash(`The Great Siege holds! ${picks.length} besieger${picks.length>1?"s are":" is"} broken and raised as your ramparts.`);}
  // Kyrgyzstan's Silk Road: enter caravan-placement mode, then tap a far-off open square.
  function toggleSilkRoad(){if(!curHuman()||over)return;
    if(caravan&&caravan.seat===turn&&caravan.step===step){ // still your turn: the caravan hasn't departed, you may reposition it
      const nb=cloneB(live.current.board);nb[caravan.r][caravan.c]=0;setBoard(nb);setCaravan(null);setCaravanMode(true);
      flash("Caravan lifted, tap a new far-off square.");return;}
    if(caravan&&caravan.seat===turn){flash("The caravan has departed, it can't be moved now.");return;}
    if(caravanMode){setCaravanMode(false);flash("Caravan off");return;}
    if(traitUsed[turn])return;
    if(placed(turn)<1){flash("Place your first piece before using an ability.");return;}
    setArmed(false);setTargeting(null);setCaravanMode(true);
    flash(`Silk Road, tap an open square at least ${CARAVAN_MIN} away from all your pieces.`);}
  // Netherlands' Oranje: enter swap mode by offering one of your unused pieces.
  function toggleRuil(){if(traitUsed[turn]||!curHuman()||over)return;if(placed(turn)<1){flash("Place your first piece before using an ability.");return;}
    if(ruil){setRuil(null);return;}
    setSel(null);setSelId(null);setTent(null);setRuil({give:null});
    flash("Oranje, tap one of your unused pieces to offer in trade.");}
  // Step 2 of Oranje: offer a piece (from the tray), then a modal lists rivals' pieces to take.
  function ruilOffer(id){if(!ruil||(used[turn]?.[id]||0)>=copies)return;setRuil({give:id});}
  // Step 3: complete the trade, gaining `take` from rival `rs`, giving them your `give`.
  function ruilTake(rs,take){const give=ruil.give;if(give==null)return;
    setUsed(u=>{const nu={...u};const me={...(nu[turn]||{})},them={...(nu[rs]||{})};
      me[give]=copies; me[take]=(me[take]||0)-1;          // I lose my give, gain a copy of their take
      them[take]=copies; them[give]=(them[give]||0)-1;    // they lose their take, gain a copy of my give
      nu[turn]=me;nu[rs]=them;return nu;});
    setTraitUsed(t=>({...t,[turn]:true}));setRuil(null);
    flash(`Oranje, traded your ${give} for ${CIVS[civOf(rs)].name}'s ${take}.`);vib(14);}
  // Morocco's Bazaar: enter/exit the tray-pick mode.
  function toggleBazaar(){if(traitUsed[turn]||!curHuman()||over)return;if(placed(turn)<1){flash("Place your first piece before using an ability.");return;}
    if(!bazaarPick){const anyUsedP=PIECE_IDS.some(id=>(used[turn]?.[id]||0)>0);
      if(!anyUsedP){flash("Nothing played yet, nothing to reclaim");return;}
      setSel(null);setSelId(null);setTent(null);}
    setBazaarPick(p=>!p);if(!bazaarPick)flash("The Bazaar: tap a piece you've already played to reclaim it");}
  // Execute the trade: reclaim `id`, permanently surrender the smallest unused piece.
  function doBazaar(id){if(!bazaarPick||(used[turn]?.[id]||0)<=0)return;
    let sur=null;for(const id2 of PIECE_IDS)if(id2!==id&&(used[turn]?.[id2]||0)<copies&&(!sur||PSIZE[id2]<PSIZE[sur]))sur=id2;
    if(!sur){flash("No unused piece left to trade away");return;}
    setUsed(u=>{const mu={...(u[turn]||{})};mu[id]=(mu[id]||0)-1;mu[sur]=copies;return {...u,[turn]:mu};});
    setTraitUsed(t=>({...t,[turn]:true}));setBazaarPick(false);
    flash(`Bazaar deal: ${id} reclaimed, ${sur} traded away for good.`);vib(14);}

  if(screen==="home")return(<Shell theme={STH}>

          <div style={{position:"absolute",top:8,left:8,zIndex:7,pointerEvents:"none",fontFamily:T.mono,fontSize:12,letterSpacing:1.5,padding:"4px 10px",borderRadius:7,background:"rgba(0,0,0,.6)",color:"#fff",animation:"evchip 1.8s ease-out forwards"}}>{eventFlash.name.toUpperCase()}</div></>}
        {isCube?
          <div onMouseLeave={cubeMouseLeave} onContextMenu={e=>e.preventDefault()} onPointerDown={cubePointerDown}
            style={{position:"relative",width:"100%",maxWidth:cubeStagePx,aspectRatio:"1",margin:"0 auto",perspective:cubeStagePx*2.2,cursor:cubeGrab?"grabbing":"default",touchAction:"pan-y",userSelect:"none"}}>
            {eventFlash&&<div style={{position:"absolute",inset:8,borderRadius:"50%",pointerEvents:"none",zIndex:8,boxShadow:`inset 0 0 0 3px ${EVT_COLOR[eventFlash.id]||T.accent},0 0 28px ${EVT_COLOR[eventFlash.id]||T.accent}`,animation:"evglow 1.7s ease-out forwards"}}/>}
            <div className="petri-board-cells" ref={cubeStageRef} style={{position:"absolute",left:"50%",top:"50%",width:cubeFacePx,height:cubeFacePx,transformStyle:"preserve-3d",
              transform:`translate(-50%,-50%) rotateX(${cubeRot.x}deg) rotateY(${cubeRot.y}deg)`,transition:cubeGrab?"none":"transform .18s ease-out"}}>
              {CUBE_FACE_IDS.map(face=>{const half=cubeFacePx/2,tf=face==="F"?`translateZ(${half}px)`:face==="B"?`rotateY(180deg) translateZ(${half}px)`:face==="R"?`rotateY(90deg) translateZ(${half}px)`:face==="L"?`rotateY(-90deg) translateZ(${half}px)`:face==="U"?`rotateX(90deg) translateZ(${half}px)`:`rotateX(-90deg) translateZ(${half}px)`;
                // Every face stays mounted through the whole turn; backfaceVisibility hides
                // the three genuinely-behind faces for free, so nothing pops or "freezes"
                // mid-rotation. Only a clearly front-facing face takes clicks/hover, so an
                // edge-on sliver at the silhouette can't steal a placement meant for the front.
                // Any face you can actually see is clickable — not just the one the
                // rotation math calls "front". 3D hit-testing routes each click to the
                // face physically nearest the cursor, so pointing at a side and clicking
                // it just works, even when two faces are almost equally head-on.
                const faceLive=face===cubeFront||(!!cubeFacing&&cubeFacing[face]>0.04);
                return <div key={face} style={{position:"absolute",inset:0,display:"grid",gridTemplateColumns:`repeat(${cubeTopo.N},1fr)`,gridTemplateRows:`repeat(${cubeTopo.N},1fr)`,gap:1,padding:1,
                  pointerEvents:faceLive?"auto":"none",background:BT.grid,border:`1px solid ${BT.line}`,borderRadius:4,boxShadow:`inset 0 0 0 1px ${BT.line},0 0 20px rgba(0,0,0,.2)`,transform:tf,backfaceVisibility:"hidden",overflow:"hidden"}}>
                  {/* Cells are only drawn for faces you can see. The 2-3 faces turned away
                      from you are skipped entirely (they're invisible behind the cube), which
                      roughly halves the work done on every hover-move — the main lag source.
                      They stay skipped only while clearly back-facing, so nothing pops as you
                      turn. */}
                  {(!!cubeFacing&&cubeFacing[face]<-0.25)?null:Array.from({length:cubeTopo.N*cubeTopo.N},(_,i)=>{const lr=Math.floor(i/cubeTopo.N),lc=i%cubeTopo.N,[r,c]=cubeGlobal(face,lr,lc,cubeTopo.N);return boardCellEl(r,c,face+":"+lr+":"+lc,lr,lc);})}
                  <span style={{position:"absolute",top:4,left:5,pointerEvents:"none",fontFamily:T.mono,fontSize:8,letterSpacing:1.2,color:T.muted,textShadow:`0 1px 2px ${BT.bg}`}}>{CUBE_FACE_NAME[face]}</span>
                </div>;})}
            </div>
            <div style={{position:"absolute",left:8,right:8,bottom:6,zIndex:12,display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,pointerEvents:"none"}}>
              <span style={{fontFamily:T.mono,fontSize:10,color:T.muted,background:"rgba(0,0,0,.48)",padding:"4px 7px",borderRadius:6}}>right-drag rotate · click a spot · Enter or Submit to place</span>
              <span style={{display:"flex",gap:4,pointerEvents:"auto"}}>
                <button onClick={()=>turnCube(-28,0)} style={{...zoomBtn,width:30,height:30,lineHeight:"28px",fontSize:14}}>←</button>
                <button onClick={()=>turnCube(0,-22)} style={{...zoomBtn,width:30,height:30,lineHeight:"28px",fontSize:14}}>↑</button>
                <button onClick={()=>turnCube(0,22)} style={{...zoomBtn,width:30,height:30,lineHeight:"28px",fontSize:14}}>↓</button>
                <button onClick={()=>turnCube(28,0)} style={{...zoomBtn,width:30,height:30,lineHeight:"28px",fontSize:14}}>→</button>
              </span>
            </div>
          </div>
        :<div onMouseLeave={clearHover} className="petri-board-cells" style={{width:"100%",aspectRatio:`${BW}/${N}`,display:"grid",gridTemplateColumns:`repeat(${BW},1fr)`,gridTemplateRows:`repeat(${N},1fr)`,gap:1,background:BT.grid,padding:1,borderRadius:10,boxShadow:"inset 0 0 0 1px "+BT.line,animation:eventFlash&&eventFlash.id==="quake"?"quakeShake .55s ease-in-out":"none"}}>
          {board.map((row,r)=>row.map((v,c)=>boardCellEl(r,c,r+","+c,r,c)))}
        </div>}
        </div>
        </div>
        {mob&&zoom!==1&&<button onClick={resetZoom} title="Reset zoom" style={{...zoomBtn,position:"absolute",top:8,right:8,zIndex:8}}>⤾</button>}
        </div>
        {!isCube&&!mob&&zoom===1&&N>22&&<div style={{fontSize:12,color:T.muted,fontFamily:T.mono,marginTop:8}}>Pinch or scroll to zoom in for tight spots.</div>}
        {/* Mobile control deck, inline right under the board: D-pad nudges the piece,
            the cluster spins/flips/places, abilities open a sheet. Compact by design. */}
        {mob&&(()=>{const arrow={flex:"1 1 0",height:38,borderRadius:8,border:`1px solid ${T.line}`,background:T.cell,color:T.ink,fontSize:20,fontFamily:T.mono,padding:0,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"};
          const dis={opacity:.3};const legal=tent&&tent.ok!==false;
          return <div style={{marginTop:8,background:T.panel,border:`1px solid ${T.line}`,borderRadius:10,padding:8,display:"flex",flexDirection:"column",gap:6}}>
            {targeting||okaArmed||caravanMode||siegeMode?
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                <div style={{flex:"1 1 0",fontFamily:T.mono,fontSize:12,color:T.accent}}>◈ {okaArmed?`Tap 5 squares to flood (${floodPick.length}/5)`:siegeMode?`Tap besiegers to wall (${siegePick.length}/${SIEGE_MAX})`:caravanMode?"Tap a far-off open square":"Tap the board to choose a target"}</div>
                {siegeMode&&siegePick.length>0&&<button onClick={()=>commitSiege(siegePick)} style={{...miniBtn,padding:"9px 14px",fontSize:14,borderColor:T.accent,color:T.accent}}>Done</button>}
                <button onClick={()=>{setTargeting(null);if(okaArmed){setOkaArmed(false);setFloodPick([]);}if(caravanMode)setCaravanMode(false);if(siegeMode){setSiegeMode(false);setSiegePick([]);}}} style={{...miniBtn,padding:"9px 14px",fontSize:14,color:T.accent}}>✕</button>
              </div>
            :<>
              {/* arrows + orient on one compact row */}
              <div style={{display:"flex",gap:5}}>
                <button onClick={()=>nudge(0,-1)} disabled={!tent} style={{...arrow,...(tent?{}:dis)}}>◀</button>
                <button onClick={()=>nudge(-1,0)} disabled={!tent} style={{...arrow,...(tent?{}:dis)}}>▲</button>
                <button onClick={()=>nudge(1,0)} disabled={!tent} style={{...arrow,...(tent?{}:dis)}}>▼</button>
                <button onClick={()=>nudge(0,1)} disabled={!tent} style={{...arrow,...(tent?{}:dis)}}>▶</button>
                <button onClick={()=>{doRot();vib(8);}} disabled={!sel} style={{...miniBtn,flex:"1 1 0",padding:"8px 4px",fontSize:12,opacity:sel?1:.4}}>⟳ Spin</button>
                <button onClick={()=>{doFlip();vib(8);}} disabled={!sel} style={{...miniBtn,flex:"1 1 0",padding:"8px 4px",fontSize:12,opacity:sel?1:.4}}>⇋ Flip</button>
              </div>
              {/* place + undo + ability */}
              <div style={{display:"flex",gap:5}}>
                <button onClick={submit} disabled={!legal} style={{...miniBtn,flex:"1 1 0",padding:"11px 8px",fontSize:14,fontWeight:500,opacity:legal?1:.4,borderColor:legal?curCol:T.line,color:legal?curCol:T.muted,background:legal?shade(curCol,-0.72):THEME.panel}}>
                  {sel?(legal?"✓ Place":"✕ Illegal"):"Pick a piece"}</button>
                <button onClick={()=>tent?setTent(null):undoPower()} disabled={!tent&&!pundo} style={{...miniBtn,flex:"0 0 auto",padding:"11px 13px",fontSize:14,opacity:(tent||pundo)?1:.4}}>↺</button>
                {hasSheet&&(()=>{const armedAbility=armed||carnArmed||minerArmed||ascentArmed||lcArmed||okaArmed||caravanMode||!!ruil||bazaarPick;
                  return <button onClick={()=>setMobSheet(true)} style={{...miniBtn,flex:"1 1 0",padding:"11px 8px",fontSize:14,fontWeight:500,borderColor:T.accent,color:armedAbility?"#0c0e12":T.accent,background:armedAbility?T.accent:shade(T.accent,-0.74)}}>Ability</button>;})()}
              </div>
            </>}
          </div>;})()}
      </div>
      <div style={{flex:"1 1 300px",maxWidth:mob?"none":430,width:mob?"100%":undefined,
        ...(mob?{}:{height:boardH||undefined,display:"flex",flexDirection:"column",minHeight:0})}}>
        {!mob&&(()=>{const legal=tent&&tent.ok!==false;const act={...miniBtn,flex:"1 1 0",minWidth:0,padding:"9px 4px",fontSize:12,whiteSpace:"nowrap"};
          return <div style={{display:"flex",gap:6,flexWrap:"nowrap",marginBottom:10,flexShrink:0}}>
            <button onClick={submit} disabled={!legal} style={{...act,opacity:legal?1:.4,borderColor:legal?curCol:T.line,color:legal?curCol:T.muted}}>✓ Submit</button>
            <button onClick={doRot} disabled={!sel} style={{...act,opacity:sel?1:.4}}>⟳ Rotate</button>
            <button onClick={doFlip} disabled={!sel} style={{...act,opacity:sel?1:.4}}>⇋ Flip</button>
            <button onClick={()=>targeting?setTargeting(null):tent?setTent(null):undoPower()} disabled={!tent&&!pundo&&!targeting} style={{...act,opacity:(tent||pundo||targeting)?1:.4,color:targeting?T.accent:T.ink}}>{targeting?"✕ Cancel":"↺ Undo"}</button>
            <button onClick={()=>setAskConcede(true)} disabled={!curHuman()||over} style={{...act,color:"#c5a37a",borderColor:"#3a3324",opacity:curHuman()&&!over?1:.4}}>Give up</button>
          </div>;})()}
        {!mob&&powerCardEl}
        {!mob&&traitCardEl}
        {!mob&&passiveCardEl}
        <div style={{...card,padding:mob?"6px 6px 4px":12,opacity:curHuman()?1:.5,
          ...(mob?{}:{flex:"1 1 auto",minHeight:0,overflowY:"auto",display:"flex",flexDirection:"column"})}} className={mob?undefined:"petri-thin"}>
          {!mob&&<div style={{fontFamily:T.mono,fontSize:12,color:T.muted,letterSpacing:1.5,marginBottom:9,display:"flex",justifyContent:"space-between"}}><span>{CIVS[civOf(cur)].name.toUpperCase()}, {curHuman()?"YOUR PIECES":scheme}</span></div>}
          {/* Mobile: one swipeable row (big pieces first) so the board stays on
              screen while you shop for a shape. Desktop keeps the wrap grid. */}
          <div style={mob?{display:"flex",flexWrap:"wrap",gap:5,justifyContent:"center"}:{display:"flex",flexWrap:"wrap",gap:7}}>
            {(mob?[...PIECE_IDS].sort((a,b)=>PSIZE[b]-PSIZE[a]):PIECE_IDS).map(id=>{const u=used[cur]?.[id]||0;const gone=u>=copies;const left=copies-u;const p=PICTURE[id];const isSel=selId===id;const px=mob?7:8;
              const tradeable=bazaarPick&&u>0; // Bazaar: played pieces light up as reclaim targets
              const offerable=ruil&&ruil.give==null&&!gone; // Oranje: unused pieces are offerable
              const isOffer=ruil&&ruil.give===id;
              const hot=tradeable||offerable||isOffer;
              return(<div key={id} onClick={()=>ruil?(offerable&&ruilOffer(id)):bazaarPick?(tradeable&&doBazaar(id)):(!gone&&pickPiece(id))} title={id} style={{position:"relative",padding:mob?4:5,borderRadius:6,cursor:(ruil?offerable:bazaarPick?tradeable:!gone&&curHuman())?"pointer":"default",background:isSel||isOffer?shade(curCol,-0.6):T.cell,border:`1px solid ${hot?curCol:isSel?curCol:T.line}`,opacity:gone?((bazaarPick||ruil)?.7:.14):(bazaarPick&&!tradeable)||(ruil&&!offerable&&!isOffer)?.35:1,...(hot?{boxShadow:`0 0 0 1px ${curCol}`}:{}),...(mob?{flex:"0 0 auto",display:"flex",alignItems:"center",justifyContent:"center"}:{})}}>
                {copies>1&&left>0&&<span style={{position:"absolute",top:-5,right:-4,fontFamily:T.mono,fontSize:10,background:T.bg,border:`1px solid ${T.line}`,borderRadius:6,padding:"0 3px",color:T.muted}}>×{left}</span>}
                <div style={{display:"grid",gridTemplateColumns:`repeat(${p.c},${px}px)`,gridTemplateRows:`repeat(${p.r},${px}px)`,gap:1}}>{p.on.map((o,i)=><div key={i} style={{width:px,height:px,borderRadius:1,background:o?curCol:"transparent"}}/>)}</div></div>);})}
          </div>
        </div>
        {mob&&<div style={{height:6}}/>}
      </div>
    </div>
    {/* Abilities sheet: powers + traits + give up, off the main screen. */}
    {mob&&mobSheet&&<div style={{...overlay,alignItems:"flex-end",padding:0}} onClick={()=>setMobSheet(false)}>
      <div onClick={e=>e.stopPropagation()} style={{width:"100%",background:T.panel,borderTop:`1px solid ${T.line}`,borderRadius:"16px 16px 0 0",padding:"14px 14px calc(18px + env(safe-area-inset-bottom))",maxHeight:"78vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <b style={{fontFamily:T.display,fontSize:14}}>Abilities</b><button onClick={()=>setMobSheet(false)} style={ghostBtn}>done</button></div>
        {powerCardEl}{traitCardEl}{passiveCardEl}
        {oTraits&&<div style={{...card,padding:"8px 12px",marginBottom:10}}>
          <span style={{fontFamily:T.mono,fontSize:10,color:colorOf(cur)}}>✦ {CIVS[civOf(cur)].name.toUpperCase()}</span> <span style={{fontSize:12,color:T.ink}}>{TRAIT[civOf(cur)][0]}</span> <span style={{fontSize:12,color:T.muted}}>,  {TRAIT[civOf(cur)][1]}</span></div>}
        <button onClick={()=>{setMobSheet(false);setAskConcede(true);}} disabled={!curHuman()||over} style={{...miniBtn,width:"100%",marginTop:4,color:"#c5a37a",borderColor:"#3a3324"}}>Give up</button>
      </div>
    </div>}
    {toast&&<div style={{...toastStyle,...(mob?{bottom:20,left:12,right:12,transform:"none",textAlign:"center"}:{})}}>{toast}</div>}
    {settingsModal}
    {ruil&&ruil.give!=null&&<div style={overlay} onClick={()=>setRuil(null)}><div onClick={e=>e.stopPropagation()} style={{...card,padding:"20px 22px",maxWidth:460,width:"100%",maxHeight:"80vh",overflow:"auto"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><b style={{fontFamily:T.display,fontSize:20}}>Oranje</b><button onClick={()=>setRuil(null)} style={ghostBtn}>cancel</button></div>
      <div style={{fontSize:12,color:T.muted,marginBottom:14}}>You offer your <b style={{color:curCol}}>{ruil.give}</b>. Tap a rival's unused piece to take it in exchange, a fair swap: they receive your {ruil.give}.</div>
      {seatsN.filter(o=>o!==turn&&!done.has(o)).map(o=>{const avail=PIECE_IDS.filter(id=>(used[o]?.[id]||0)<copies);
        return <div key={o} style={{marginBottom:12}}>
          <div style={{fontFamily:T.mono,fontSize:12,color:colorOf(o),marginBottom:6}}>✦ {CIVS[civOf(o)].name.toUpperCase()}</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {avail.map(id=>{const p=PICTURE[id];const px=7;return <div key={id} onClick={()=>ruilTake(o,id)} title={id} style={{padding:5,borderRadius:6,border:`1px solid ${T.line}`,cursor:"pointer",background:T.cell}}>
              <div style={{display:"grid",gridTemplateColumns:`repeat(${p.c},${px}px)`,gridTemplateRows:`repeat(${p.r},${px}px)`,gap:1}}>{p.on.map((on,i)=><div key={i} style={{width:px,height:px,borderRadius:1,background:on?colorOf(o):"transparent"}}/>)}</div></div>;})}
            {avail.length===0&&<span style={{fontSize:12,color:T.muted}}>no unused pieces</span>}
          </div></div>;})}
    </div></div>}
    {askConcede&&<div style={overlay} onClick={()=>setAskConcede(false)}><div onClick={e=>e.stopPropagation()} style={{...card,padding:"24px 28px",textAlign:"center",maxWidth:340}}>
      <div style={{fontFamily:T.display,fontSize:20,marginBottom:6}}>{codeMatchActive?"Leave this seat?":"Bend the knee?"}</div>
      <div style={{fontSize:14,color:T.muted,marginBottom:18,lineHeight:1.5}}>{codeMatchActive?`A ${botTierFor(rankedRec(save,codeDraft.clock).mmr).label} Petri bot near your rating will inherit ${CIVS[civOf(turn)].name}, its pieces, clock and abilities.`:`${CIVS[civOf(turn)].name} stops growing for good. The others carry on without you. No takebacks.`}</div>
      <div style={{display:"flex",gap:8,justifyContent:"center"}}>
        <button onClick={()=>codeMatchActive?replaceCodePlayer():(setAskConcede(false),concede())} style={{...primaryBtn,background:"#c5a37a"}}>{codeMatchActive?"Let Petri take over":"Bend the knee"}</button>
        <button onClick={()=>setAskConcede(false)} style={{...miniBtn,padding:"11px 18px"}}>Fight on</button></div></div></div>}
    {over&&overHidden&&<button onClick={()=>setOverHidden(false)} style={{...primaryBtn,position:"fixed",bottom:22,left:"50%",transform:"translateX(-50%)",zIndex:55}}>Results</button>}
    {over&&!overHidden&&(()=>{const anyHuman=seatsN.some(s=>seats[s-1].kind==="human");
      const won=winTeam?seatsN.some(s=>teamOf(s)===winTeam&&seats[s-1].kind==="human"):seats[winner-1]?.kind==="human";
      const wColor=winTeam?teamColor(winTeam):colorOf(winner);
      const winL=["You smothered the competition. Masterful.","Total saturation. The dish belongs to you.","Out grew, out cornered, out lasted them all."];
      const loseL=["Out grown by a machine. Humbling.","Boxed in and squeezed out. Not your plate today.","The colony collapsed. Regroup and run it back."];
      const pool=(!anyHuman||won)?winL:loseL;const line=pool[Math.floor(overSeed*pool.length)%pool.length];
      const status=!anyHuman?"GAME OVER":won?"VICTORY":"DEFEAT";
      return <div style={overlay}><div style={{...card,padding:"28px 34px 30px",textAlign:"center",minWidth:300,maxWidth:390,borderColor:wColor,boxShadow:`0 0 40px ${wColor}55`,position:"relative"}}>
        <button onClick={()=>setOverHidden(true)} title="View the board" style={{...ghostBtn,position:"absolute",top:10,right:10,padding:"4px 10px"}}>close</button>
        <div style={{fontFamily:T.display,fontWeight:600,fontSize:34,letterSpacing:3,color:won||!anyHuman?wColor:T.muted,marginBottom:2}}>{status}</div>
        <div style={{fontFamily:T.display,fontSize:24,margin:"4px 0 4px",color:wColor}}>{winTeam?`Team ${winTeam} takes the dish`:`${CIVS[civOf(winner)].name} takes the dish`}</div>
        <div style={{fontSize:14,color:T.ink,marginBottom:16,lineHeight:1.5}}>{line}</div>
        {teamList.length?<div style={{display:"grid",gap:8,marginBottom:20}}>{teamList.slice().sort((a,b)=>teamScore(b)-teamScore(a)).map(t=>(
          <div key={t} style={{border:`1px solid ${teamColor(t)}`,borderRadius:8,padding:"8px 12px",opacity:t===winTeam?1:.6}}>
            <div style={{display:"flex",justifyContent:"space-between",fontFamily:T.mono,fontSize:14,fontWeight:500,marginBottom:4,color:teamColor(t)}}><span>Team {t}</span><b>{teamScore(t)}</b></div>
            {seatsN.filter(s=>teamOf(s)===t).map(s=>(<div key={s} style={{display:"flex",justifyContent:"space-between",fontFamily:T.mono,fontSize:12}}>
              <span style={{display:"flex",gap:7,alignItems:"center"}}><span style={{width:10,height:10,borderRadius:3,background:colorOf(s)}}/>{CIVS[civOf(s)].name}</span><span style={{color:T.muted}}>{scoreOf(s)}</span></div>))}
          </div>))}
          {seatsN.filter(s=>!teamOf(s)).length>0&&seatsN.filter(s=>!teamOf(s)).sort((a,b)=>scoreOf(b)-scoreOf(a)).map(s=>(
            <div key={s} style={{display:"flex",justifyContent:"space-between",fontFamily:T.mono,fontSize:14,padding:"0 12px"}}><span style={{display:"flex",gap:7,alignItems:"center"}}><span style={{width:10,height:10,borderRadius:3,background:colorOf(s)}}/>{CIVS[civOf(s)].name}</span><b>{scoreOf(s)}</b></div>))}
        </div>
        :<div style={{display:"grid",gap:6,marginBottom:20}}>{standings.map((s,i)=>(<div key={s} style={{display:"flex",justifyContent:"space-between",gap:24,fontFamily:T.mono,fontSize:14,opacity:i===0?1:.6}}>
          <span style={{display:"flex",gap:8,alignItems:"center"}}><span style={{width:6,textAlign:"right"}}>{i+1}</span><span style={{width:11,height:11,borderRadius:3,background:colorOf(s)}}/>{CIVS[civOf(s)].name}</span><b>{scoreOf(s)}</b></div>))}</div>}
        {rankedMatch&&rankedMatch.delta!==null&&<div style={{padding:"11px 13px",borderRadius:9,background:T.cell,border:`1px solid ${rankedMatch.delta>=0?"#75c39a":"#ef7e88"}`,margin:"-8px 0 16px",fontFamily:T.mono}}>
          <div style={{fontSize:10,color:T.muted}}>{rankedMatch.mode.toUpperCase()} RATING</div><div style={{fontSize:20,fontWeight:500,color:rankedMatch.delta>=0?"#75c39a":"#ef7e88"}}>{rankedMatch.delta>=0?"+":""}{rankedMatch.delta} <span style={{fontSize:14,color:T.ink}}>→ {rankedMatch.newMmr}</span></div><div style={{fontSize:10,color:T.muted}}>{rankedMatch.newRank}</div></div>}
        <div style={{display:"flex",gap:8,justifyContent:"center"}}>{rankedMatch?<button onClick={()=>{setRankedMatch(null);setQueue(null);setScreen("online");}} style={primaryBtn}>Ranked lobby</button>:<button onClick={startGame} style={primaryBtn}>Play again</button>}<button onClick={()=>{setDaily(null);setDailyInfo(null);setRankedMatch(null);setScreen("home");}} style={{...miniBtn,padding:"11px 18px"}}>Main menu</button></div>
      </div></div>;})()}
  </Shell>);
}


ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
